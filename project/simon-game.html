    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: rgba(26, 31, 51, 0.85);
            --card-border: rgba(255, 255, 255, 0.12);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.6);
            --red: #f43f5e;
            --red-glow: rgba(244, 63, 94, 0.6);
            --yellow: #f59e0b;
            --yellow-glow: rgba(245, 158, 11, 0.6);
            --blue: #3b82f6;
            --blue-glow: rgba(59, 130, 246, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 100%);
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 12px;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Top Navigation Header */
        .top-header {
            width: 100%;
            max-width: 440px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .game-badge {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.65rem;
            color: var(--yellow);
            text-shadow: 0 0 10px var(--yellow-glow);
        }

        /* Main Game Wrapper */
        .game-wrapper {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 20px 16px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Status & Level */
        .status-box {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 10px 18px;
            margin-bottom: 20px;
        }

        .level-info {
            display: flex;
            flex-direction: column;
        }

        .level-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .level-val {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.1rem;
            color: #38bdf8;
            margin-top: 4px;
        }

        .level-val.high {
            color: #fbbf24;
        }

        /* Simon Board Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            justify-items: center;
            align-items: center;
            margin-bottom: 24px;
        }

        .tile {
            width: clamp(125px, 38vw, 160px);
            height: clamp(125px, 38vw, 160px);
            border-radius: 28px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
        }

        .tile:active {
            transform: scale(0.94);
        }

        .green {
            background: radial-gradient(circle at 35% 35%, #34d399, #059669);
            box-shadow: 0 8px 20px -5px rgba(5, 150, 105, 0.4);
        }
        .green.lit {
            filter: brightness(1.6);
            box-shadow: 0 0 35px var(--green-glow);
            transform: scale(1.05);
        }

        .red {
            background: radial-gradient(circle at 35% 35%, #fb7185, #e11d48);
            box-shadow: 0 8px 20px -5px rgba(225, 29, 72, 0.4);
        }
        .red.lit {
            filter: brightness(1.6);
            box-shadow: 0 0 35px var(--red-glow);
            transform: scale(1.05);
        }

        .yellow {
            background: radial-gradient(circle at 35% 35%, #fde047, #d97706);
            box-shadow: 0 8px 20px -5px rgba(217, 119, 6, 0.4);
        }
        .yellow.lit {
            filter: brightness(1.6);
            box-shadow: 0 0 35px var(--yellow-glow);
            transform: scale(1.05);
        }

        .blue {
            background: radial-gradient(circle at 35% 35%, #60a5fa, #2563eb);
            box-shadow: 0 8px 20px -5px rgba(37, 99, 235, 0.4);
        }
        .blue.lit {
            filter: brightness(1.6);
            box-shadow: 0 0 35px var(--blue-glow);
            transform: scale(1.05);
        }

        /* CTA Button */
        .btn-start {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
            color: white;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.5);
            transition: all 0.2s ease;
        }

        .btn-start:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .btn-start:active {
            transform: translateY(1px);
        }

        .game-status-msg {
            font-size: 0.95rem;
            color: var(--text-muted);
            min-height: 24px;
            margin-bottom: 12px;
            text-align: center;
            font-weight: 600;
        }

        .instructions {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 14px;
            text-align: center;
        }

        @keyframes bounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <header class="top-header">
        <span class="game-badge">SIMON MEMORY</span>
    </header>

    <!-- Main Wrapper -->
    <main class="game-wrapper">
        <!-- Status / Level -->
        <div class="status-box">
            <div class="level-info">
                <span class="level-label">Cấp độ</span>
                <span class="level-val" id="level">1</span>
            </div>
            <div class="level-info" style="align-items: flex-end;">
                <span class="level-label">Kỷ lục</span>
                <span class="level-val high" id="highScore">1</span>
            </div>
        </div>

        <div class="game-status-msg" id="statusMsg">Bấm "Bắt Đầu" để thử thách trí nhớ!</div>

        <!-- 2x2 Simon Tiles -->
        <div class="game-grid" id="grid">
            <div class="green tile" data-color="green"></div>
            <div class="red tile" data-color="red"></div>
            <div class="yellow tile" data-color="yellow"></div>
            <div class="blue tile" data-color="blue"></div>
        </div>

        <!-- Control Action -->
        <button id="start" class="btn-start" onclick="handleClick()">
            <i class="uil uil-play"></i> Bắt Đầu Chơi
        </button>

        <p class="instructions">Quan sát chuỗi màu phát sáng và bấm lại theo đúng thứ tự</p>
    </main>

    <script>
        const grid = document.querySelector('#grid');
        const tiles = document.getElementsByClassName("tile");
        const levelEl = document.getElementById("level");
        const highScoreEl = document.getElementById("highScore");
        const statusMsg = document.getElementById("statusMsg");
        const startBtn = document.getElementById("start");

        let solutionArray = [];
        let userArray = [];
        let isAcceptingInput = false;

        // High score
        let high = parseInt(localStorage.getItem('simon_high_score') || '1', 10);
        highScoreEl.textContent = high;

        // Web Audio API Sound Synthesizer (Instant & Reliable on all mobile browsers)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const colorFreqs = {
            green: 329.63, // E4
            red: 261.63,   // C4
            yellow: 220.0,  // A3
            blue: 164.81   // E3
        };

        function playTone(freq, duration = 250, isError = false) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = isError ? 'sawtooth' : 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration / 1000);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration / 1000);
        }

        function flashTile(tile, duration = 300) {
            const color = tile.getAttribute('data-color');
            tile.classList.add('lit');
            playTone(colorFreqs[color], duration);
            setTimeout(() => {
                tile.classList.remove('lit');
            }, duration);
        }

        function playSequence() {
            isAcceptingInput = false;
            statusMsg.textContent = "Hãy chú ý quan sát...";
            let i = 0;
            const interval = setInterval(() => {
                flashTile(solutionArray[i], 350);
                i++;
                if (i >= solutionArray.length) {
                    clearInterval(interval);
                    setTimeout(() => {
                        isAcceptingInput = true;
                        statusMsg.textContent = "Lượt của bạn! Hãy bấm theo thứ tự.";
                    }, 400);
                }
            }, 600);
        }

        function nextRound() {
            userArray = [];
            const currentLvl = solutionArray.length + 1;
            levelEl.textContent = currentLvl;

            if (currentLvl > high) {
                high = currentLvl;
                localStorage.setItem('simon_high_score', high);
                highScoreEl.textContent = high;
            }

            const randomTile = tiles[Math.floor(Math.random() * tiles.length)];
            solutionArray.push(randomTile);

            setTimeout(playSequence, 600);
        }

        function handleTileClick(e) {
            if (!isAcceptingInput) return;
            const tile = e.target.closest('.tile');
            if (!tile) return;

            flashTile(tile, 200);
            userArray.push(tile);

            const currentIndex = userArray.length - 1;
            if (userArray[currentIndex] !== solutionArray[currentIndex]) {
                // Game Over
                isAcceptingInput = false;
                playTone(110, 500, true); // Error buzz
                statusMsg.textContent = "Rất tiếc! Bạn đã chọn sai.";
                statusMsg.style.color = "#f43f5e";
                startBtn.style.display = "inline-flex";
                startBtn.innerHTML = '<i class="uil uil-redo"></i> Chơi Lại';
                return;
            }

            // Completed current round
            if (userArray.length === solutionArray.length) {
                isAcceptingInput = false;
                statusMsg.textContent = "Chính xác! Chuẩn bị vòng kế tiếp...";
                statusMsg.style.color = "#34d399";
                setTimeout(() => {
                    statusMsg.style.color = "var(--text-muted)";
                    nextRound();
                }, 800);
            }
        }

        function handleClick() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            solutionArray = [];
            userArray = [];
            statusMsg.style.color = "var(--text-muted)";
            startBtn.style.display = "none";
            nextRound();
        }

        grid.addEventListener("click", handleTileClick);
    </script>
</body>
