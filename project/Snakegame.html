  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(22, 30, 49, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #10b981;
      --primary-glow: rgba(16, 185, 129, 0.35);
      --accent: #f43f5e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg-dark) 100%);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* Top Navigation Header */
    .top-header {
      width: 100%;
      max-width: 440px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .game-badge {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.65rem;
      color: var(--primary);
      text-shadow: 0 0 10px var(--primary-glow);
    }

    /* Main Container */
    .game-wrapper {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 16px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Scoreboard */
    .scoreboard {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 10px 16px;
      margin-bottom: 12px;
    }

    .score-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .score-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .score-val {
      font-family: 'Press Start 2P', monospace;
      font-size: 1.1rem;
      color: #38bdf8;
      margin-top: 4px;
    }

    .score-val.high {
      color: #fbbf24;
    }

    /* Canvas Stage */
    .canvas-stage {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      background: #020617;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    /* Game Over & Pause Overlay */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 10;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-title {
      font-family: 'Press Start 2P', cursive;
      font-size: 1.2rem;
      color: var(--accent);
      margin-bottom: 12px;
      text-shadow: 0 0 15px rgba(244, 63, 94, 0.5);
    }

    .overlay-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px var(--primary-glow);
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .btn-action:active {
      transform: translateY(1px);
    }

    /* Touch Controls D-Pad */
    .dpad-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 14px;
      gap: 6px;
    }

    .dpad-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .dpad-btn {
      width: 58px;
      height: 52px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      cursor: pointer;
      user-select: none;
      touch-action: none;
      transition: background 0.1s, transform 0.1s;
    }

    .dpad-btn:active, .dpad-btn.pressed {
      background: var(--primary);
      color: #020617;
      transform: scale(0.92);
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .instructions {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 8px;
      text-align: center;
    }

    @media (min-width: 768px) {
      body {
        padding-top: 30px;
      }
    }

<body>

  <!-- Top Header -->
  <header class="top-header">
    <span class="game-badge">SNAKE RETRO</span>
  </header>

  <!-- Main Game Wrapper -->
  <main class="game-wrapper">
    <!-- Score Header -->
    <div class="scoreboard">
      <div class="score-box">
        <span class="score-label">Điểm số</span>
        <span class="score-val" id="currentScore">0</span>
      </div>
      <div class="score-box" style="align-items: flex-end;">
        <span class="score-label">Kỷ lục</span>
        <span class="score-val high" id="highScore">0</span>
      </div>
    </div>

    <!-- Canvas Stage -->
    <div class="canvas-stage">
      <canvas width="400" height="400" id="game"></canvas>

      <!-- Overlay Game Over -->
      <div class="overlay" id="gameOverOverlay">
        <h2 class="overlay-title">GAME OVER</h2>
        <p class="overlay-desc">Bạn đạt được <span id="finalScore" style="color: #38bdf8; font-weight: 700;">0</span> điểm!</p>
        <button class="btn-action" id="restartBtn">
          <i class="uil uil-redo"></i> Chơi Lại
        </button>
      </div>
    </div>

    <!-- Touch D-Pad for Mobile -->
    <div class="dpad-container" id="dpadControls">
      <div class="dpad-row">
        <button class="dpad-btn" id="btnUp" aria-label="Lên"><i class="uil uil-angle-up"></i></button>
      </div>
      <div class="dpad-row">
        <button class="dpad-btn" id="btnLeft" aria-label="Trái"><i class="uil uil-angle-left"></i></button>
        <button class="dpad-btn" id="btnDown" aria-label="Xuống"><i class="uil uil-angle-down"></i></button>
        <button class="dpad-btn" id="btnRight" aria-label="Phải"><i class="uil uil-angle-right"></i></button>
      </div>
    </div>

    <p class="instructions">Dùng phím mũi tên hoặc WASD trên PC • Cụm phím ảo trên điện thoại</p>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const context = canvas.getContext('2d');
    const currentScoreEl = document.getElementById('currentScore');
    const highScoreEl = document.getElementById('highScore');
    const finalScoreEl = document.getElementById('finalScore');
    const overlay = document.getElementById('gameOverOverlay');
    const restartBtn = document.getElementById('restartBtn');

    // Score Tracking
    let score = 0;
    let high = parseInt(localStorage.getItem('snake_high_score') || '0', 10);
    highScoreEl.textContent = high;

    const grid = 16;
    let count = 0;
    let animationId = null;
    let isGameOver = false;

    let snake = {
      x: 160,
      y: 160,
      dx: grid,
      dy: 0,
      cells: [],
      maxCells: 4
    };

    let apple = {
      x: 320,
      y: 320
    };

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min)) + min;
    }

    function resetGame() {
      score = 0;
      currentScoreEl.textContent = score;
      snake.x = 160;
      snake.y = 160;
      snake.cells = [];
      snake.maxCells = 4;
      snake.dx = grid;
      snake.dy = 0;
      apple.x = getRandomInt(0, 25) * grid;
      apple.y = getRandomInt(0, 25) * grid;
      isGameOver = false;
      overlay.classList.remove('active');
    }

    function triggerGameOver() {
      isGameOver = true;
      finalScoreEl.textContent = score;
      if (score > high) {
        high = score;
        localStorage.setItem('snake_high_score', high);
        highScoreEl.textContent = high;
      }
      overlay.classList.add('active');
    }

    function loop() {
      animationId = requestAnimationFrame(loop);

      if (isGameOver) return;

      // Slow game loop to 15 fps
      if (++count < 4) return;
      count = 0;

      context.clearRect(0, 0, canvas.width, canvas.height);

      // Move snake by its velocity
      snake.x += snake.dx;
      snake.y += snake.dy;

      // Wrap snake position horizontally on edge of screen
      if (snake.x < 0) {
        snake.x = canvas.width - grid;
      } else if (snake.x >= canvas.width) {
        snake.x = 0;
      }

      // Wrap snake position vertically on edge of screen
      if (snake.y < 0) {
        snake.y = canvas.height - grid;
      } else if (snake.y >= canvas.height) {
        snake.y = 0;
      }

      // Keep track of where snake has been
      snake.cells.unshift({x: snake.x, y: snake.y});

      // Remove cells as we move away from them
      if (snake.cells.length > snake.maxCells) {
        snake.cells.pop();
      }

      // Draw Apple with glowing style
      context.fillStyle = '#f43f5e';
      context.beginPath();
      const r = (grid - 2) / 2;
      context.arc(apple.x + r + 1, apple.y + r + 1, r, 0, Math.PI * 2);
      context.fill();

      // Draw Snake
      snake.cells.forEach(function(cell, index) {
        // Head is brighter green, body has slight gradient
        if (index === 0) {
          context.fillStyle = '#34d399';
        } else {
          context.fillStyle = '#059669';
        }

        // Draw rounded rectangle for snake segment
        roundRect(context, cell.x, cell.y, grid - 1, grid - 1, 3);

        // Snake ate apple
        if (cell.x === apple.x && cell.y === apple.y) {
          snake.maxCells++;
          score += 10;
          currentScoreEl.textContent = score;

          // Reposition apple
          apple.x = getRandomInt(0, 25) * grid;
          apple.y = getRandomInt(0, 25) * grid;
        }

        // Check collision with all cells after this one
        for (let i = index + 1; i < snake.cells.length; i++) {
          if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
            triggerGameOver();
          }
        }
      });
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      ctx.fill();
    }

    // Direction controllers
    function goLeft() {
      if (snake.dx === 0) {
        snake.dx = -grid;
        snake.dy = 0;
      }
    }
    function goUp() {
      if (snake.dy === 0) {
        snake.dy = -grid;
        snake.dx = 0;
      }
    }
    function goRight() {
      if (snake.dx === 0) {
        snake.dx = grid;
        snake.dy = 0;
      }
    }
    function goDown() {
      if (snake.dy === 0) {
        snake.dy = grid;
        snake.dx = 0;
      }
    }

    // Keyboard listener
    document.addEventListener('keydown', function(e) {
      if (isGameOver && (e.key === 'Enter' || e.code === 'Space')) {
        resetGame();
        return;
      }

      if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && snake.dx === 0) {
        goLeft();
      } else if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && snake.dy === 0) {
        goUp();
      } else if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && snake.dx === 0) {
        goRight();
      } else if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && snake.dy === 0) {
        goDown();
      }
    });

    // Touch D-Pad buttons listeners
    const bindBtn = (btn, action) => {
      const handler = (e) => {
        e.preventDefault();
        btn.classList.add('pressed');
        if (isGameOver) {
          resetGame();
        } else {
          action();
        }
      };
      btn.addEventListener('touchstart', handler, { passive: false });
      btn.addEventListener('mousedown', handler);
      const unpress = () => btn.classList.remove('pressed');
      btn.addEventListener('touchend', unpress);
      btn.addEventListener('mouseup', unpress);
      btn.addEventListener('mouseleave', unpress);
    };

    bindBtn(document.getElementById('btnUp'), goUp);
    bindBtn(document.getElementById('btnLeft'), goLeft);
    bindBtn(document.getElementById('btnDown'), goDown);
    bindBtn(document.getElementById('btnRight'), goRight);

    restartBtn.addEventListener('click', resetGame);

    // Start Game
    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
