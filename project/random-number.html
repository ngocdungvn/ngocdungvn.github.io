  <style>
    :root {
      --bg-body: #FAF8F5;
      --bg-card: #FFFFFF;
      --bg-cream: #FFFDF0;
      --bg-track: #E2E8F0;
      --border: #000000;
      --border-sm: 2px solid #000000;
      --border-base: 3px solid #000000;
      --primary: #FFE600;
      --primary-hover: #FFF04D;
      --accent-mint: #00F0A8;
      --accent-purple: #7047EB;
      --accent-pink: #FF6584;
      --accent-blue: #38BDF8;
      --text-main: #000000;
      --text-sub: #262626;
      --text-dim: #525252;
      --radius-xs: 6px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --shadow-neo-sm: 2px 2px 0px #000000;
      --shadow-neo: 3.5px 3.5px 0px #000000;
      --shadow-neo-lg: 5px 5px 0px #000000;
      --shadow-neo-active: 1px 1px 0px #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-body);
      color: var(--text-main);
      padding: 1.25rem 1rem 3.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Canvas Confetti */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    /* Font số chuẩn số học */
    .num-font {
      font-family: 'Inter', sans-serif;
      font-variant-numeric: tabular-nums;
      font-weight: 900;
    }

    /* Header Nav */
    .header-top {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    .brand-badge {
      font-size: 0.82rem;
      font-weight: 800;
      color: #000000;
      background: #FFFFFF;
      padding: 0.35rem 0.95rem;
      border-radius: var(--radius-full);
      border: 2px solid #000000;
      box-shadow: var(--shadow-neo-sm);
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      letter-spacing: 0.01em;
      transform: rotate(-0.5deg);
    }

    .brand-badge i {
      color: #000000 !important;
      font-size: 1.1rem;
    }

    /* Page Title */
    .page-title {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .page-title h1 {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-transform: uppercase;
    }

    .page-title h1 i {
      color: #000000 !important;
      background: var(--primary);
      padding: 0.2rem 0.45rem;
      border: var(--border-sm);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-neo-sm);
    }

    .page-title p {
      color: #262626;
      font-size: 0.88rem;
      font-weight: 700;
      margin-top: 0.5rem;
      display: inline-block;
      background: #FFFFFF;
      padding: 0.25rem 0.85rem;
      border: 2px solid #000000;
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-neo-sm);
    }

    /* Main Container */
    .app-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* BIG NUMBER DISPLAY STAGE */
    .stage-card {
      background: var(--bg-card);
      border: 3px solid #000000;
      border-radius: var(--radius-lg);
      padding: 1.75rem 2rem;
      position: relative;
      box-shadow: var(--shadow-neo-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .stage-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: #000000;
    }

    .stage-main-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      align-items: center;
      gap: 1.5rem;
      width: 100%;
    }

    .stage-left-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-width: 0;
      width: 100%;
    }

    .stage-right-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      width: 100%;
    }

    .stage-status {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #000000;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 0.4rem;
      margin-bottom: 0.4rem;
      background: #FFFFFF;
      padding: 0.25rem 0.85rem;
      border-radius: var(--radius-full);
      border: 2px solid #000000;
      box-shadow: var(--shadow-neo-sm);
      max-width: 100%;
    }

    .stage-status.rolling {
      color: #000000;
      background: var(--accent-mint);
      animation: pulse 0.8s infinite;
    }

    .stage-status.suspense {
      color: #000000;
      background: #FFE600;
      border-color: #000000;
      animation: suspensePulse 0.35s ease-in-out infinite alternate;
    }

    @keyframes suspensePulse {
      0% {
        transform: scale(1);
        box-shadow: 2px 2px 0px #000000;
      }

      100% {
        transform: scale(1.05);
        box-shadow: 3.5px 3.5px 0px #000000;
        background: #FFD000;
      }
    }

    .stage-status.winner {
      color: #000000;
      background: var(--accent-mint);
    }

    /* Main Big Number */
    .number-display {
      font-size: clamp(4.5rem, 13vw, 7.5rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: #000000;
      padding: 0.3rem 0.2em;
      min-height: 1.2em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: visible;
    }

    .number-display.pop {
      transform: scale(1.12);
      color: #000000;
    }

    .number-display.suspense {
      color: #000000;
      animation: suspenseShake 0.12s ease-in-out infinite alternate;
    }

    @keyframes suspenseShake {
      0% {
        transform: translate(-1.5px, 0.5px) scale(1.02);
      }

      100% {
        transform: translate(1.5px, -0.5px) scale(0.98);
      }
    }

    .number-display.highlight {
      color: #000000;
      text-shadow: 4px 4px 0px var(--primary), 7px 7px 0px rgba(0, 0, 0, 0.15);
      animation: bounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Sub list if rolling multiple numbers (Neobrutalism Badges) */
    .multiple-results {
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.65rem;
      margin-top: 1.25rem;
      padding-top: 1.15rem;
      border-top: 2px dashed #000000;
      width: 100%;
    }

    .multiple-results.show {
      display: flex;
    }

    .num-badge {
      font-size: 1.35rem;
      font-weight: 900;
      background: var(--primary);
      color: #000000;
      padding: 0.45rem 1rem;
      border-radius: var(--radius-sm);
      border: var(--border-sm);
      box-shadow: var(--shadow-neo-sm);
      min-width: 52px;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.6) translateY(8px);
      }

      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .stage-range-info {
      font-size: 0.85rem;
      font-weight: 700;
      color: #262626;
      margin-top: 0.35rem;
    }

    .stage-range-info strong {
      color: #000000;
      background: var(--bg-cream);
      padding: 0.1rem 0.35rem;
      border: var(--border-sm);
      border-radius: var(--radius-xs);
    }

    /* MAIN ACTION BUTTON (NEOBRUTALISM RECTANGULAR TOUCH-OPTIMIZED) */
    .btn-spin {
      width: 100%;
      background: var(--primary);
      color: #000000;
      border: 3px solid #000000;
      border-radius: var(--radius-md);
      padding: 1.15rem 1.2rem;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      box-shadow: var(--shadow-neo);
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      text-align: center;
    }

    .btn-spin:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px #000000;
      background: var(--primary-hover);
    }

    .btn-spin:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0px #000000;
    }

    .btn-spin:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none !important;
      background: #E5E5E5;
      color: #737373;
      box-shadow: 2px 2px 0px #000000;
    }

    .btn-spin i {
      font-size: 1.4rem;
      stroke-width: 2px;
      transition: transform 0.5s ease;
    }

    .btn-spin.spinning i {
      animation: spin 0.6s linear infinite;
    }

    /* CONTROL & SETTINGS GRID */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }

    @media (min-width: 768px) {
      .controls-grid {
        grid-template-columns: 1.2fr 1fr;
      }
    }

    .card-panel {
      background: var(--bg-card);
      border: 3px solid #000000;
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-neo-lg);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.15rem;
    }

    .panel-header h3 {
      font-size: 1.05rem;
      font-weight: 900;
      color: #000000;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.01em;
    }

    .panel-header h3 i {
      color: #000000;
      background: var(--primary);
      padding: 0.25rem 0.4rem;
      border: 2px solid #000000;
      border-radius: var(--radius-xs);
      box-shadow: 1.5px 1.5px 0px #000000;
      font-size: 1.1rem;
    }

    /* RANGE INPUTS: A ĐẾN Z */
    .range-inputs-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 1rem;
    }

    .input-box {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .input-box label {
      font-size: 0.8rem;
      font-weight: 800;
      color: #000000;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .input-field-wrap {
      position: relative;
    }

    .range-input {
      width: 100%;
      background: #FFFFFF;
      border: var(--border-sm);
      border-radius: var(--radius-md);
      padding: 0.7rem 0.85rem;
      font-size: 1.15rem;
      font-weight: 800;
      color: #000000;
      box-shadow: var(--shadow-neo);
      outline: none;
      transition: all 0.15s ease;
    }

    .range-input:focus,
    .range-input:focus-visible {
      outline: 3px solid #000000;
      outline-offset: 2px;
      background: var(--bg-cream);
      box-shadow: var(--shadow-neo-lg);
      transform: translate(-1px, -1px);
    }

    .btn-swap {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: var(--primary);
      border: var(--border-sm);
      box-shadow: var(--shadow-neo-sm);
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.15rem;
      font-weight: 800;
      margin-top: 1.25rem;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      touch-action: manipulation;
    }

    .btn-swap:hover {
      transform: translate(-1px, -1px) rotate(180deg);
      box-shadow: var(--shadow-neo);
    }

    .btn-swap:active {
      transform: translate(2px, 2px) rotate(180deg);
      box-shadow: var(--shadow-neo-active);
    }

    /* QUICK PRESETS */
    .presets-title {
      font-size: 0.78rem;
      font-weight: 800;
      color: #000000;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.5rem;
    }

    .presets-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 1.25rem;
    }

    .preset-pill {
      background: #FFFFFF;
      border: 2px solid #000000;
      box-shadow: var(--shadow-neo-sm);
      color: #000000;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 0.4rem 0.85rem;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all 0.12s ease;
      touch-action: manipulation;
    }

    .preset-pill:hover {
      background: var(--bg-cream);
      transform: translate(-1px, -1px);
      box-shadow: var(--shadow-neo);
    }

    .preset-pill.active {
      background: var(--primary);
      color: #000000;
      transform: translate(2px, 2px);
      box-shadow: var(--shadow-neo-active);
    }

    /* SỐ KẾT QUẢ MỖI LẦN QUAY (XỔ XUỐNG) */
    .count-selector-group {
      margin-top: 0.25rem;
      margin-bottom: 1.25rem;
      padding-top: 1rem;
      border-top: 2px solid #000000;
    }

    .count-title {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      font-weight: 800;
      color: #000000;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.5rem;
    }

    .count-select-wrap {
      width: 100%;
    }

    .option-select {
      width: 100%;
      background: #FFFFFF;
      border: 2px solid #000000;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-neo-sm);
      padding: 0.65rem 0.85rem;
      min-height: 44px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #000000;
      outline: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .option-select:focus,
    .option-select:focus-visible {
      outline: 3px solid #000000;
      outline-offset: 2px;
      background: var(--bg-cream);
      box-shadow: var(--shadow-neo);
      transform: translate(-1px, -1px);
    }

    /* TOGGLE: KHÔNG TRÙNG LẶP */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding-top: 1rem;
      border-top: 2px solid #000000;
    }

    .toggle-label {
      font-size: 0.85rem;
      font-weight: 800;
      color: #000000;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* Custom switch Neobrutalism */
    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 28px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--bg-track);
      border: var(--border-sm);
      box-shadow: var(--shadow-neo-sm);
      transition: .2s ease;
      border-radius: var(--radius-full);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 2px;
      bottom: 2px;
      background-color: #FFFFFF;
      border: 2px solid #000000;
      transition: .2s ease;
      border-radius: 50%;
    }

    input:checked+.slider {
      background-color: var(--accent-mint);
    }

    input:checked+.slider:before {
      transform: translateX(20px);
      background-color: var(--primary);
    }

    /* Switch Focus Indicator (Neobrutalism A11y) */
    .switch input:focus+.slider,
    .switch input:focus-visible+.slider {
      outline: 3px solid #000000;
      outline-offset: 3px;
      box-shadow: 3.5px 3.5px 0px #000000;
    }

    /* Focus-Visible for All Interactive Buttons */
    .btn-spin:focus-visible,
    .btn-swap:focus-visible,
    .preset-pill:focus-visible,
    .btn-secondary:focus-visible {
      outline: 3px solid #000000 !important;
      outline-offset: 2px !important;
    }

    /* RIGHT PANEL: HISTORY & STATS */
    .history-card {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .history-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 1rem;
      background: var(--bg-cream);
      padding: 0.75rem;
      border-radius: var(--radius-md);
      border: var(--border-sm);
      box-shadow: var(--shadow-neo-sm);
    }

    .stat-item {
      text-align: center;
    }

    .stat-label {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #525252;
    }

    .stat-val {
      font-size: 1.25rem;
      font-weight: 900;
      color: #000000;
      margin-top: 0.15rem;
    }

    .history-list-wrap {
      flex: 1;
      max-height: 250px;
      overflow-y: auto;
      border: var(--border-sm);
      border-radius: var(--radius-md);
      padding: 0.65rem;
      display: flex;
      flex-direction: column-reverse;
      gap: 0.45rem;
      background: #F8FAFC;
    }

    .history-item {
      background: #FFFFFF;
      border: 2px solid #000000;
      border-radius: var(--radius-sm);
      padding: 0.5rem 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 2px 2px 0px #000000;
      animation: slideIn 0.2s ease;
    }

    .history-item-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .history-index {
      font-size: 0.75rem;
      font-weight: 800;
      color: #525252;
      min-width: 28px;
    }

    .history-val {
      font-size: 1.15rem;
      font-weight: 900;
      color: #000000;
    }

    .history-time {
      font-size: 0.75rem;
      font-weight: 700;
      color: #737373;
    }

    .history-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 140px;
      color: #737373;
      font-size: 0.88rem;
      font-weight: 700;
      gap: 0.4rem;
    }

    .history-empty i {

    /* TOAST */

    .toast.show {

    /* Keyframe Animations */
    @keyframes spin {
      from {

      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {

      0%,

      }

      }
    }

    @keyframes bounce {
      0% {
        transform: scale(0.7);
      }

      60% {
        transform: scale(1.15);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-8px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Mobile responsive optimizations */
    @media (max-width: 640px) {

    /* Accessibility: Respect Reduced Motion Preferences */

</head>

<body>

    <!-- CONTROLS & HISTORY GRID -->

      <!-- LEFT: RANGE (A - Z) & PRESETS & OPTIONS -->

          <button type="button" class="btn-swap" id="btn-swap" title="Hoán đổi Min - Max"
            aria-label="Hoán đổi giá trị nhỏ nhất và lớn nhất">

              <option value="1" selected>1 số</option>

          </span>
          <label class="switch" for="toggle-unique">
            <input type="checkbox" id="toggle-unique" aria-labelledby="toggle-unique-label" />

      <!-- RIGHT: HISTORY & STATS -->
      <section class="card-panel history-card">
        <div class="panel-header">

        <!-- Stats -->
        <div class="history-stats">
          <div class="stat-item">
            <div class="stat-label">Lượt quay</div>

          <div class="stat-item">
            <div class="stat-label">Nhỏ nhất</div>

          </div>
          <div class="stat-item">
            <div class="stat-label">Lớn nhất</div>
            <div class="stat-val num-font" id="stat-max">-</div>
          </div>
        </div>

        <!-- History list -->
        <div class="history-list-wrap" id="history-list">
          <div class="history-empty" id="history-empty">
            <i class="uil uil-clock-three"></i>

          </div>

        <!-- Actions -->
        <div class="history-actions">
          <button type="button" class="btn-secondary" id="btn-copy">
            <i class="uil uil-copy-alt"></i> Sao Chép Kết Quả
          </button>

  </main>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <i class="uil uil-check-circle"></i>
    <span>Đã sao chép kết quả!</span>
  </div>

  <script>
    /* ============================================================
       QUAY SỐ NGẪU NHIÊN - LOGIC ENGINE
       ============================================================ */

    // DOM Elements
    const numberDisplay = document.getElementById('number-display');
    const multipleResults = document.getElementById('multiple-results');
    const stageStatus = document.getElementById('stage-status');
    const stageRangeInfo = document.getElementById('stage-range-info');
    const btnSpin = document.getElementById('btn-spin');
    const inputMin = document.getElementById('input-min');
    const inputMax = document.getElementById('input-max');
    const btnSwap = document.getElementById('btn-swap');
    const presetPills = document.querySelectorAll('.preset-pill');
    const selectCount = document.getElementById('select-count');
    const toggleUnique = document.getElementById('toggle-unique');
    const historyList = document.getElementById('history-list');
    const historyEmpty = document.getElementById('history-empty');
    const statCount = document.getElementById('stat-count');
    const statMin = document.getElementById('stat-min');
    const statMax = document.getElementById('stat-max');
    const btnCopy = document.getElementById('btn-copy');
    const btnClearHistory = document.getElementById('btn-clear-history');
    const toast = document.getElementById('toast');

    // State
    let isSpinning = false;
    let history = []; // Array of { val: string, time: string, numbers: number[] }
    let lastResult = null;
    let usedNumbers = new Set(); // For unique mode
    const duration = 1500; // Tốc độ quay số mặc định cố định 1.5s

    // Helper: Cryptographically Secure Random Int in [min, max] (CSPRNG)
    // Loại trừ hoàn toàn sai số Modulo Bias bằng thuật toán Rejection Sampling chuẩn mật mã
    function getRandomInt(min, max) {
      min = Math.ceil(min);
      max = Math.floor(max);
      if (min > max) {
        const temp = min; min = max; max = temp;
      }
      const range = max - min + 1;
      if (range <= 1) return min;

      const cryptoObj = window.crypto || window.msCrypto;
      if (cryptoObj && cryptoObj.getRandomValues) {
        // Sử dụng Uint32Array (4.29 tỷ giá trị từ 0 đến 4,294,967,295)
        const maxUint32 = 0xFFFFFFFF;
        // Giới hạn an toàn chia hết cho range để tránh hiện tượng modulo bias
        const limit = maxUint32 - (maxUint32 % range);
        const buffer = new Uint32Array(1);
        let randVal;
        do {
          cryptoObj.getRandomValues(buffer);
          randVal = buffer[0];
        } while (randVal >= limit);

        return min + (randVal % range);
      }

      // Fallback an toàn cho trình duyệt không hỗ trợ crypto
      return Math.floor(Math.random() * range) + min;
    }

    // Update range info text
    function updateRangeInfo() {
      const min = parseInt(inputMin.value, 10) || 0;
      const max = parseInt(inputMax.value, 10) || 0;
      stageRangeInfo.innerHTML = `Phạm vi hiện tại: từ <strong>${Math.min(min, max)}</strong> đến <strong>${Math.max(min, max)}</strong>`;
    }

    inputMin.addEventListener('input', updateRangeInfo);
    inputMax.addEventListener('input', updateRangeInfo);

    // Swap Min / Max
    btnSwap.addEventListener('click', () => {
      const temp = inputMin.value;
      inputMin.value = inputMax.value;
      inputMax.value = temp;
      updateRangeInfo();
      checkPresetMatch();
    });

    // Preset pills handler
    presetPills.forEach(pill => {
      pill.addEventListener('click', () => {
        presetPills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        inputMin.value = pill.dataset.min;
        inputMax.value = pill.dataset.max;
        updateRangeInfo();
      });
    });

    function checkPresetMatch() {
      const min = inputMin.value;
      const max = inputMax.value;
      presetPills.forEach(pill => {
        if (pill.dataset.min === min && pill.dataset.max === max) {
          pill.classList.add('active');
        } else {
          pill.classList.remove('active');
        }
      });
    }

    // Lựa chọn số kết quả mỗi lần quay (xổ xuống)
    selectCount.addEventListener('change', resetUniquePool);

    // Toast Notification
    function showToast(msg) {
      toast.querySelector('span').innerText = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // Reset unique tracking if range or toggle changes
    function resetUniquePool() {
      usedNumbers.clear();
    }
    inputMin.addEventListener('change', resetUniquePool);
    inputMax.addEventListener('change', resetUniquePool);
    toggleUnique.addEventListener('change', resetUniquePool);

    /* ============================================================
       SPIN NUMBER ENGINE (Hiệu ứng nhảy số ngẫu nhiên)
       ============================================================ */
    function spin() {
      if (isSpinning) return;

      let min = parseInt(inputMin.value, 10);
      let max = parseInt(inputMax.value, 10);

      if (isNaN(min) || isNaN(max)) {
        showToast('Vui lòng nhập đầy đủ giá trị từ A đến Z!');
        return;
      }

      if (min > max) {
        // Auto swap
        const temp = min;
        min = max;
        max = temp;
        inputMin.value = min;
        inputMax.value = max;
        updateRangeInfo();
      }

      const count = parseInt(selectCount.value, 10) || 1;
      const totalPossible = max - min + 1;

      // Unique check
      if (toggleUnique.checked) {
        const remaining = totalPossible - usedNumbers.size;
        if (remaining < count) {
          showToast(`Đã hết số khả dụng không trùng trong khoảng [${min} - ${max}]! Tự động đặt lại.`);
          usedNumbers.clear();
        }
      }

      // Chuẩn bị danh sách số trúng thưởng (Thuật toán CSPRNG + Fisher-Yates Selection)
      const finalNumbers = [];

      if (toggleUnique.checked) {
        // Chế độ không trùng lặp: Thuật toán Fisher-Yates Selection Pool
        if (totalPossible <= 50000) {
          const availablePool = [];
          for (let val = min; val <= max; val++) {
            if (!usedNumbers.has(val)) {
              availablePool.push(val);
            }
          }

          // Rút thăm k số ngẫu nhiên từ pool bằng Fisher-Yates swap O(1)
          for (let i = 0; i < count && availablePool.length > 0; i++) {
            const randIdx = getRandomInt(0, availablePool.length - 1);
            const chosen = availablePool[randIdx];
            availablePool[randIdx] = availablePool[availablePool.length - 1];
            availablePool.pop();

            finalNumbers.push(chosen);
            usedNumbers.add(chosen);
          }
        } else {
          // Dải số cực lớn (> 50.000 số): Rejection Sampling an toàn
          const batchSet = new Set();
          while (finalNumbers.length < count && (totalPossible - usedNumbers.size) > 0) {
            const n = getRandomInt(min, max);
            if (!usedNumbers.has(n) && !batchSet.has(n)) {
              finalNumbers.push(n);
              batchSet.add(n);
              usedNumbers.add(n);
            }
          }
        }
      } else {
        // Chế độ cho phép lặp lại giữa các lần quay
        // Trong cùng 1 lượt quay: các số không trùng nhau nếu count <= totalPossible
        const batchSet = new Set();
        for (let i = 0; i < count; i++) {
          let n;
          let attempts = 0;
          do {
            n = getRandomInt(min, max);
            attempts++;
          } while (batchSet.has(n) && count <= totalPossible && attempts < 100);
          batchSet.add(n);
          finalNumbers.push(n);
        }
      }

      // Kiểm tra thiết lập giảm chuyển động của người dùng (WCAG 2.3.3)
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReducedMotion) {
        renderFinalResult(finalNumbers, min, max, true);
        return;
      }

      // Rolling Animation Mode: Gồm 2 giai đoạn (Quay nhanh + 0.5s Hiệu ứng hồi hộp trước khi chốt kết quả)
      const rollDuration = 1000; // 1s quay lướt nhanh ban đầu
      const suspenseDuration = 500; // Đúng 0.5s hiệu ứng hồi hộp trước khi ra kết quả
      const totalDuration = rollDuration + suspenseDuration; // 1.5s tổng thời gian

      isSpinning = true;
      btnSpin.disabled = true;
      btnSpin.classList.add('spinning');
      stageStatus.className = 'stage-status rolling';
      stageStatus.innerHTML = '<i class="uil uil-spinner-alt"></i> Đang quay số...';
      numberDisplay.classList.remove('highlight', 'suspense');
      multipleResults.classList.remove('show');
      multipleResults.innerHTML = '';

      const startTime = performance.now();
      let lastTickTime = 0;
      let inSuspense = false;

      function step(now) {
        const elapsed = now - startTime;

        if (elapsed < rollDuration) {
          // GIAI ĐOẠN 1: QUAY LƯỚT NHANH (0 -> 1000ms)
          const rollProgress = elapsed / rollDuration;
          const interval = 25 + Math.pow(rollProgress, 2) * 55; // 25ms -> 80ms

          if (now - lastTickTime >= interval) {
            lastTickTime = now;
            const tempVal = getRandomInt(min, max);
            numberDisplay.innerText = tempVal;
            numberDisplay.classList.add('pop');
            setTimeout(() => numberDisplay.classList.remove('pop'), 50);
          }
        } else if (elapsed < totalDuration) {
          // GIAI ĐOẠN 2: ĐÚNG 0.5 GIÂY HIỆU ỨNG HỒI HỘP TRƯỚC KHI RA KẾT QUẢ (1000ms -> 1500ms)
          if (!inSuspense) {
            inSuspense = true;
            stageStatus.className = 'stage-status suspense';
            stageStatus.innerHTML = '<i class="uil uil-hourglass"></i> Sắp có kết quả...';
            numberDisplay.classList.add('suspense');
          }

          // Nhịp số nhảy chậm dần tạo cảm giác hồi hộp, kịch tính
          const suspenseElapsed = elapsed - rollDuration; // 0 -> 500ms
          const suspenseProgress = suspenseElapsed / suspenseDuration; // 0 -> 1
          const interval = 90 + Math.pow(suspenseProgress, 2) * 220; // 90ms -> 310ms

          if (now - lastTickTime >= interval) {
            lastTickTime = now;
            const tempVal = getRandomInt(min, max);
            numberDisplay.innerText = tempVal;
            numberDisplay.classList.add('pop');
            setTimeout(() => numberDisplay.classList.remove('pop'), 70);
          }
        } else {
          // GIAI ĐOẠN 3: KẾT THÚC VÀ CHỐT KẾT QUẢ CHÍNH THỨC!
          isSpinning = false;
          btnSpin.disabled = false;
          btnSpin.classList.remove('spinning');
          numberDisplay.classList.remove('suspense');
          renderFinalResult(finalNumbers, min, max, false);
          return;
        }

        requestAnimationFrame(step);
      }

      requestAnimationFrame(step);
    }

    function renderFinalResult(numbers, min, max, isReducedMotion = false) {
      lastResult = numbers;
      const primaryNumber = numbers[0];

      numberDisplay.innerText = primaryNumber;
      if (!isReducedMotion) {
        numberDisplay.classList.add('highlight');
      } else {
        numberDisplay.classList.remove('highlight', 'pop');
      }

      stageStatus.className = 'stage-status winner';

      // If count > 1, show badges
      if (numbers.length > 1) {
        stageStatus.innerHTML = `<i class="uil uil-trophy"></i> ${numbers.length} số may mắn của bạn!`;
        stageStatus.setAttribute('aria-label', `${numbers.length} số may mắn: ${numbers.join(', ')}`);
        multipleResults.innerHTML = '';
        numbers.forEach(num => {
          const badge = document.createElement('span');
          badge.className = 'num-badge num-font';
          badge.innerText = num;
          multipleResults.appendChild(badge);
        });
        multipleResults.classList.add('show');
      } else {
        stageStatus.innerHTML = '<i class="uil uil-trophy"></i> Số may mắn của bạn!';
        stageStatus.removeAttribute('aria-label');
        multipleResults.classList.remove('show');
        multipleResults.innerHTML = '';
      }

      // Confetti celebration (tắt khi người dùng bật reduced motion)
      if (!isReducedMotion) {
        triggerConfetti();
      }

      // Add to history
      addToHistory(numbers);
    }

    /* ============================================================
       HISTORY & STATISTICS
       ============================================================ */
    function addToHistory(numbers) {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      history.unshift({
        numbers: numbers,
        val: numbers.join(', '),
        time: timeStr
      });

      renderHistory();
      updateStats();
    }

    function renderHistory() {
      if (history.length === 0) {
        historyList.innerHTML = `
          <div class="history-empty" id="history-empty">
            <i class="uil uil-clock-three"></i>
            <span>Chưa có lượt quay nào</span>
          </div>
        `;
        return;
      }

      historyList.innerHTML = '';
      // Show up to 50 recent items
      history.slice(0, 50).forEach((item, idx) => {
        const itemEl = document.createElement('div');
        itemEl.className = 'history-item';
        const displayIndex = history.length - idx;
        itemEl.innerHTML = `
          <div class="history-item-left">
            <span class="history-index">#${displayIndex}</span>
            <span class="history-val num-font">${item.val}</span>
          </div>
          <span class="history-time">${item.time}</span>
        `;
        historyList.appendChild(itemEl);
      });
    }

    function updateStats() {
      statCount.innerText = history.length;
      if (history.length === 0) {
        statMin.innerText = '-';
        statMax.innerText = '-';
        return;
      }

      let allNums = [];
      history.forEach(h => {
        if (Array.isArray(h.numbers)) {
          allNums = allNums.concat(h.numbers);
        } else if (typeof h.val === 'number') {
          allNums.push(h.val);
        }
      });

      if (allNums.length > 0) {
        statMin.innerText = Math.min(...allNums);
        statMax.innerText = Math.max(...allNums);
      } else {
        statMin.innerText = '-';
        statMax.innerText = '-';
      }
    }

    // Clear history
    btnClearHistory.addEventListener('click', () => {
      if (history.length === 0) return;
      history = [];
      usedNumbers.clear();
      renderHistory();
      updateStats();
      showToast('Đã xóa toàn bộ lịch sử quay số!');
    });

    // Copy result
    btnCopy.addEventListener('click', async () => {
      if (!lastResult || (Array.isArray(lastResult) && lastResult.length === 0)) {
        showToast('Chưa có kết quả để sao chép!');
        return;
      }
      const text = Array.isArray(lastResult) ? lastResult.join(', ') : `${lastResult}`;
      try {
        await navigator.clipboard.writeText(text);
        showToast(`Đã sao chép kết quả: ${text}`);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(`Đã sao chép kết quả: ${text}`);
      }
    });

    // Event Listeners
    btnSpin.addEventListener('click', spin);

    // Keyboard Shortcuts (Space / Enter)
    window.addEventListener('keydown', (e) => {
      const activeEl = document.activeElement;
      const tagName = activeEl ? activeEl.tagName.toLowerCase() : '';

      // 1. Don't trigger if user is actively typing in an input or select
      if (['input', 'textarea', 'select'].includes(tagName)) {
        if (e.key === 'Enter') {
          e.preventDefault();
          activeEl.blur();
          spin();
        }
        return;
      }

      // 2. If user is focused on any secondary button (presets, swap, copy, clear, count-pills),
      // allow native Space/Enter button click activation instead of spinning!
      if (tagName === 'button' && activeEl.id !== 'btn-spin') {
        return;
      }

      // 3. Trigger spin when pressing Space or Enter (on body or on the spin button)
      if (e.code === 'Space' || e.key === 'Enter') {
        e.preventDefault();
        spin();
      }
    });

    /* ============================================================
       CANVAS CONFETTI ENGINE (Không cần thư viện ngoài)
       ============================================================ */
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let confettiParticles = [];
    let confettiAnimId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerConfetti() {
      const colors = ['#FFE600', '#00F0A8', '#FF6584', '#38BDF8', '#7047EB', '#000000'];
      const count = 70;
      const centerX = canvas.width / 2;
      const centerY = canvas.height * 0.38;

      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 9 + 4;
        confettiParticles.push({
          x: centerX,
          y: centerY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 3,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 15,
          opacity: 1,
          gravity: 0.28
        });
      }

      if (!confettiAnimId) {
        animateConfetti();
      }
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = confettiParticles.length - 1; i >= 0; i--) {
        const p = confettiParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.rotation += p.rotationSpeed;
        p.opacity -= 0.014;

        if (p.opacity <= 0 || p.y > canvas.height) {
          confettiParticles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.globalAlpha = Math.max(0, p.opacity);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      }

      if (confettiParticles.length > 0) {
        confettiAnimId = requestAnimationFrame(animateConfetti);
      } else {
        confettiAnimId = null;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    // Init
    updateRangeInfo();
  </script>
