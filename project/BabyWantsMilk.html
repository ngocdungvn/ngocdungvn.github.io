	<style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(22, 30, 49, 0.85);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.4);
            --accent: #ec4899;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 100%);
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 12px;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Top Navigation Header */
        .top-header {
            width: 100%;
            max-width: 440px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .game-badge {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.65rem;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary-glow);
        }

        /* Main Game Wrapper */
        .game-wrapper {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 16px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Status & Level Bar */
        .status-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 10px 16px;
            margin-bottom: 14px;
        }

        .level-text {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.85rem;
            color: var(--primary);
        }

        .key-indicator {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .key-indicator.has-key {
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }

        /* Maze Board Container */
        .maze-container {
            position: relative;
            background-color: #1e3a8a;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
            margin: 0 auto 14px auto;
        }

		.char-style {
			position: absolute;
			z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            user-select: none;
            transition: left 0.1s ease, top 0.1s ease;
		}

        /* Overlay */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(9, 13, 22, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 10;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.1rem;
            color: #34d399;
            margin-bottom: 12px;
            text-shadow: 0 0 15px rgba(52, 211, 153, 0.5);
        }

        .overlay-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .btn-replay {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: white;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px var(--primary-glow);
            transition: all 0.2s ease;
        }

        .instructions {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 12px;
            text-align: center;
        }

<body>

  <!-- Top Header -->
  <header class="top-header">
    <span class="game-badge">BABY & MILK</span>
  </header>

  <!-- Main Game Card -->
  <main class="game-wrapper">
    <!-- Status Bar -->
    <div class="status-bar">
      <span class="level-text" id="status">Màn 1</span>
      <span class="key-indicator" id="keyIndicator">
        <i class="uil uil-key-skeleton"></i> Chìa khóa: Chưa có
      </span>
    </div>

    <!-- Maze Board -->
    <div id="home" class="maze-container">
      <!-- Game Over Modal -->
      <div class="overlay" id="gameOverOverlay">
        <h2 class="overlay-title">CHIẾN THẮNG! 🍼</h2>
        <p class="overlay-desc">Bé đã được uống sữa đầy đủ qua tất cả các màn!</p>
        <button class="btn-replay" id="replayBtn">
          <i class="uil uil-redo"></i> Chơi Lại Từ Đầu
        </button>
      </div>
    </div>

    <p class="instructions"><i class="uil uil-keyboard"></i> Dùng phím Mũi tên hoặc W, A, S, D để di chuyển • Phím Cách (Space) để mở cửa hoặc nhặt bình sữa</p>
  </main>

<script>
let homePlans = [
    `
    ====================
    =      =           =
    =  b   =           =
    =                  =
    ========    ========
    =                  =
    =      =    =      =
    =      =    =   m  =
    =      =    =      =
    ====================`,
    
    `
    ====================
    =      =           =
    =  b   =    =      =
    =      =    =   m  =
    =====  =    ========
    =  c        d      =
    =      =    =      =
    =      =    =      =
    =      =    =      =
    ====================`,
    
    `
    ====================
    = s         =   = t=
    =      =    =   =d==
    =      =           =
    =====  =    ========
    =      =           =
    =  =====    =====  =
    =      =    =   =  =
    =  b   =    = m    =
    ====================`,
    
    `
    ====================
    =          c=      =
    =      =    =   =  =
    =====  =        =  =
    =      ==========d==
    =d======    =      =
    =      =  m =  =====
    =====  =    =      =
    =  b   =         e =
    ====================`,
    
    `
    ====================
    =      =           =
    =  b   =    =      =
    =      =    =   k  =
    =====  =    ========
    =  c        d      =
    =      =    =      =
    =      =    =      =
    =      =    =   m  =
    ====================`,
    
    `
    ====================
    =  s       c=      =
    =      =    =   =  =
    =====  =        = k=
    =      ==d==========
    =d======    =   m  =
    =  b   =    =  =====
    =====  =    =      =
    =  k   =         e =
    ====================`
];

let charText = {
    "=": "🧱",
    "b": "👶",
    "d": "🚪",
    "c": "🪑",
    "m": "🍼",
    "t": "🚽",
    "s": "🛋️",
    "e": "🛏️",
    "k": "🔑"
};

// Web Audio API chime sounds
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playChime(success = true) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = success ? 'sine' : 'triangle';
    osc.frequency.setValueAtTime(success ? 587.33 : 330, audioCtx.currentTime); // D5 or E4
    if (success) {
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2); // A5
    }
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
}

const home = document.getElementById("home");
const statusEl = document.getElementById("status");
const keyIndicator = document.getElementById("keyIndicator");
const overlay = document.getElementById("gameOverOverlay");
const replayBtn = document.getElementById("replayBtn");

let scale = 18;
let x = 0, y = 0;
let level = 0;
let homePlan, baby, useKey = false, hasKey = false;
let isGameOver = false;

function calculateScale() {
    const maxWidth = Math.min(380, document.querySelector('.game-wrapper').clientWidth - 32);
    scale = Math.max(14, Math.floor(maxWidth / 20));
    home.style.width = `${20 * scale}px`;
    home.style.height = `${10 * scale}px`;
}
calculateScale();
window.addEventListener('resize', () => {
    calculateScale();
    cleanupHome();
    updateHome();
});

function createNode(text, left, top) {
    let node = document.createElement("div");
    node.textContent = text;
    node.style.fontSize = `${scale - 2}px`;
    node.style.width = `${scale}px`;
    node.style.height = `${scale}px`;
    node.style.left = `${left * scale}px`;
    node.style.top = `${top * scale}px`;
    node.className = "char-style";
    node.id = `char-at-${left}-${top}`;
    return node;
}

function updateHome() {
    statusEl.textContent = `Màn ${level + 1} / ${homePlans.length}`;
    hasKey = false;
    updateKeyUI();

    homePlan = homePlans[level].trim().split("\n").map(line => {
        line = line.trim();
        return [...line] 
    });
    useKey = false;

    for(let i = 0; i < homePlan.length; i++) {
        for(let j = 0; j < homePlan[i].length; j++) {
            let ch = homePlan[i][j];
            if(ch !== " ") {
                let node = createNode(charText[ch] || ch, j, i);
                home.appendChild(node);
                if (ch === "b") {
                    baby = node;
                    x = j;
                    y = i;
                    homePlan[i][j] = " ";
                } else if (ch === "k") {
                    useKey = true;
                }
            }
        }
    }
}

function updateKeyUI() {
    if (hasKey) {
        keyIndicator.innerHTML = '<i class="uil uil-key-skeleton"></i> Chìa khóa: CÓ';
        keyIndicator.classList.add('has-key');
    } else {
        keyIndicator.innerHTML = '<i class="uil uil-key-skeleton"></i> Chìa khóa: Chưa có';
        keyIndicator.classList.remove('has-key');
    }
}

function cleanupHome() {
    let nodes = home.querySelectorAll(".char-style");
    for(let eachNode of nodes) {
        eachNode.remove();
    }
}

function makeAction(r, c) {
    let node, flag = false;
    switch(homePlan[r][c]) {
        case "k":
            hasKey = true;
            updateKeyUI();
            playChime(true);
            node = document.getElementById(`char-at-${c}-${r}`);
            break;

        case "d":
            if(!useKey || hasKey) {
                node = document.getElementById(`char-at-${c}-${r}`);
                hasKey = false;
                updateKeyUI();
                playChime(true);
            }
            break;
    }
    if(node) {
        node.remove();
        homePlan[r][c] = " ";
        flag = true;
    }
    return flag;
}

function doSomeAction() {
    let flag = false;
    if(x > 0) flag = makeAction(y, x - 1);
    if(!flag && x < homePlan[y].length - 1) flag = makeAction(y, x + 1);
    if(!flag && y > 0) flag = makeAction(y - 1, x);
    if(!flag && y < homePlan.length - 1) flag = makeAction(y + 1, x);
}

function moveBaby(dx, dy) {
    if (isGameOver) return;
    const newX = x + dx;
    const newY = y + dy;

    if (newX >= 0 && newX < homePlan[0].length && newY >= 0 && newY < homePlan.length) {
        const targetTile = homePlan[newY][newX];
        if (" m".includes(targetTile)) {
            x = newX;
            y = newY;
            baby.style.left = `${x * scale}px`;
            baby.style.top = `${y * scale}px`;

            // Reach Milk
            if (targetTile === "m") {
                playChime(true);
                if (level < homePlans.length - 1) {
                    level++;
                    cleanupHome();
                    updateHome();
                } else {
                    isGameOver = true;
                    overlay.classList.add('active');
                }
            }
        }
    }
}

// Keyboard controls
window.addEventListener("keydown", (event) => {
    switch(event.key) {
        case "ArrowLeft":
        case "a":
        case "A":
            moveBaby(-1, 0);
            event.preventDefault();
            break;
        case "ArrowRight":
        case "d":
        case "D":
            moveBaby(1, 0);
            event.preventDefault();
            break;
        case "ArrowUp":
        case "w":
        case "W":
            moveBaby(0, -1);
            event.preventDefault();
            break;
        case "ArrowDown":
        case "s":
        case "S":
            moveBaby(0, 1);
            event.preventDefault();
            break;
        case " ":
            doSomeAction();
            event.preventDefault();
            break;
    }
});

replayBtn.addEventListener('click', () => {
    level = 0;
    isGameOver = false;
    overlay.classList.remove('active');
    cleanupHome();
    updateHome();
});

// Start game
updateHome();
</script>
</body>
