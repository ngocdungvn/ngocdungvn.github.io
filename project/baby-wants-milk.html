	<style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(22, 30, 49, 0.85);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.4);
            --accent: #ec4899;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Top HUD Header */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 10px 24px;
            margin-bottom: 12px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            transition: width 0.15s ease;
        }

        .hud-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .game-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: #38bdf8;
            letter-spacing: 0.5px;
            text-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
        }

        .level-badge {
            font-size: 0.95rem;
            font-weight: 700;
            color: #e0f2fe;
            background: rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 4px 14px;
            border-radius: 20px;
        }

        .key-indicator {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .key-indicator.has-key {
            color: #fbbf24;
            font-weight: 700;
            text-shadow: 0 0 12px rgba(251, 191, 36, 0.6);
        }

        /* Game Container Wrapper */
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Maze Board Container */
        .maze-container {
            position: relative;
            background-color: #172554;
            border: 4px solid rgba(56, 189, 248, 0.4);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(56, 189, 248, 0.15), inset 0 0 40px rgba(0, 0, 0, 0.95);
            margin: 0 auto;
        }

		.char-style {
			position: absolute;
			z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            user-select: none;
            transition: left 0.08s linear, top 0.08s linear;
		}

        .char-style.is-baby {
            z-index: 5;
            overflow: visible;
        }

        .baby-avatar-img {
            width: 140%;
            height: 140%;
            max-width: none;
            max-height: none;
            object-fit: contain;
            pointer-events: none;
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.8));
            transition: transform 0.12s ease;
        }

        /* Overlay */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(9, 13, 22, 0.92);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 10;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #34d399;
            margin-bottom: 16px;
            text-shadow: 0 0 25px rgba(52, 211, 153, 0.6);
        }

        .overlay-desc {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .btn-replay {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 36px;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: white;
            font-weight: 700;
            font-size: 1.15rem;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 12px 30px -5px var(--primary-glow);
            transition: all 0.2s ease;
        }

        .btn-replay:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 35px -4px var(--primary-glow);
        }

        .instructions {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-top: 12px;
            text-align: center;
            opacity: 0.9;
        }
	</style>
</head>
<body>

  <!-- Top HUD Header -->
  <header class="hud-header" id="hudHeader">
    <div class="hud-left">
      <span class="game-title">BÉ MIU & BÌNH SỮA 🍼</span>
      <span class="level-badge" id="status">Màn 1 / 6</span>
    </div>
    <div class="hud-right">
      <span class="key-indicator" id="keyIndicator">
        <i class="uil uil-key-skeleton"></i> Chìa khóa: Chưa có
      </span>
    </div>
  </header>

  <!-- Main Game Card -->
  <main class="game-wrapper">
    <!-- Maze Board -->
    <div id="home" class="maze-container">
      <!-- Game Over Modal -->
      <div class="overlay" id="gameOverOverlay">
        <h2 class="overlay-title">BÉ MIU CHIẾN THẮNG! 🍼</h2>
        <p class="overlay-desc">Bé Miu đã được uống sữa no nê qua tất cả các màn!</p>
        <button class="btn-replay" id="replayBtn">
          <i class="uil uil-redo"></i> Chơi Lại Từ Đầu
        </button>
      </div>
    </div>

    <p class="instructions"><i class="uil uil-keyboard"></i> Dùng phím Mũi tên hoặc W, A, S, D để di chuyển • Phím Cách (Space) để mở cửa hoặc nhặt bình sữa</p>
  </main>

<script>
let homePlans = [
    `
    ====================
    =      =           =
    =  b   =           =
    =                  =
    ========    ========
    =                  =
    =      =    =      =
    =      =    =   m  =
    =      =    =      =
    ====================`,
    
    `
    ====================
    =      =           =
    =  b   =    =      =
    =      =    =   m  =
    =====  =    ========
    =  c        d      =
    =      =    =      =
    =      =    =      =
    =      =    =      =
    ====================`,
    
    `
    ====================
    = s         =   = t=
    =      =    =   =d==
    =      =           =
    =====  =    ========
    =      =           =
    =  =====    =====  =
    =      =    =   =  =
    =  b   =    = m    =
    ====================`,
    
    `
    ====================
    =          c=      =
    =      =    =   =  =
    =====  =        =  =
    =      ==========d==
    =d======    =      =
    =      =  m =  =====
    =====  =    =      =
    =  b   =         e =
    ====================`,
    
    `
    ====================
    =      =           =
    =  b   =    =      =
    =      =    =   k  =
    =====  =    ========
    =  c        d      =
    =      =    =      =
    =      =    =      =
    =      =    =   m  =
    ====================`,
    
    `
    ====================
    =  s       c=      =
    =      =    =   =  =
    =====  =        = k=
    =      ==d==========
    =d======    =   m  =
    =  b   =    =  =====
    =====  =    =      =
    =  k   =         e =
    ====================`
];

let charText = {
    "=": "🧱",
    "b": "👶",
    "d": "🚪",
    "c": "🪑",
    "m": "🍼",
    "t": "🚽",
    "s": "🛋️",
    "e": "🛏️",
    "k": "🔑"
};

// Web Audio API chime sounds
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playChime(success = true) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = success ? 'sine' : 'triangle';
    osc.frequency.setValueAtTime(success ? 587.33 : 330, audioCtx.currentTime); // D5 or E4
    if (success) {
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2); // A5
    }
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
}

const home = document.getElementById("home");
const statusEl = document.getElementById("status");
const keyIndicator = document.getElementById("keyIndicator");
const overlay = document.getElementById("gameOverOverlay");
const replayBtn = document.getElementById("replayBtn");

let scale = 18;
let x = 0, y = 0;
let level = 0;
let homePlan, baby, useKey = false, hasKey = false;
let isGameOver = false;

function calculateScale() {
    const hud = document.getElementById('hudHeader');
    const instructions = document.querySelector('.instructions');
    
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    
    // Space reserved for HUD, instructions & margins
    const hudHeight = hud ? hud.offsetHeight : 54;
    const instHeight = instructions ? instructions.offsetHeight : 30;
    const verticalPadding = hudHeight + instHeight + 40; 
    const horizontalPadding = 48;
    
    const availW = Math.max(300, vw - horizontalPadding);
    const availH = Math.max(160, vh - verticalPadding);
    
    // Maze is 20 columns, 10 rows
    const scaleByW = Math.floor(availW / 20);
    const scaleByH = Math.floor(availH / 10);
    
    // Fill the screen as wide and large as possible!
    scale = Math.max(16, Math.min(scaleByW, scaleByH));
    
    const boardW = 20 * scale;
    const boardH = 10 * scale;
    
    home.style.width = `${boardW}px`;
    home.style.height = `${boardH}px`;
    
    if (hud) {
        hud.style.width = `${boardW}px`;
    }
}
calculateScale();
window.addEventListener('resize', () => {
    calculateScale();
    cleanupHome();
    updateHome();
});

function createNode(ch, left, top) {
    let node = document.createElement("div");
    node.style.width = `${scale}px`;
    node.style.height = `${scale}px`;
    node.style.left = `${left * scale}px`;
    node.style.top = `${top * scale}px`;
    node.className = "char-style";
    node.id = `char-at-${left}-${top}`;

    if (ch === "b") {
        node.classList.add("is-baby");
        const img = document.createElement("img");
        img.src = "images/baby.png";
        img.alt = "Bé Miu";
        img.className = "baby-avatar-img";
        node.appendChild(img);
    } else {
        node.textContent = charText[ch] || ch;
        node.style.fontSize = `${Math.round(scale * 0.72)}px`;
    }
    return node;
}

function updateHome() {
    statusEl.textContent = `Màn ${level + 1} / ${homePlans.length}`;
    hasKey = false;
    updateKeyUI();

    homePlan = homePlans[level].trim().split("\n").map(line => {
        line = line.trim();
        return [...line] 
    });
    useKey = false;

    for(let i = 0; i < homePlan.length; i++) {
        for(let j = 0; j < homePlan[i].length; j++) {
            let ch = homePlan[i][j];
            if(ch !== " ") {
                let node = createNode(ch, j, i);
                home.appendChild(node);
                if (ch === "b") {
                    baby = node;
                    x = j;
                    y = i;
                    homePlan[i][j] = " ";
                } else if (ch === "k") {
                    useKey = true;
                }
            }
        }
    }
}

function updateKeyUI() {
    if (hasKey) {
        keyIndicator.innerHTML = '<i class="uil uil-key-skeleton"></i> Chìa khóa: CÓ';
        keyIndicator.classList.add('has-key');
    } else {
        keyIndicator.innerHTML = '<i class="uil uil-key-skeleton"></i> Chìa khóa: Chưa có';
        keyIndicator.classList.remove('has-key');
    }
}

function cleanupHome() {
    let nodes = home.querySelectorAll(".char-style");
    for(let eachNode of nodes) {
        eachNode.remove();
    }
}

function makeAction(r, c) {
    let node, flag = false;
    switch(homePlan[r][c]) {
        case "k":
            hasKey = true;
            updateKeyUI();
            playChime(true);
            node = document.getElementById(`char-at-${c}-${r}`);
            break;

        case "d":
            if(!useKey || hasKey) {
                node = document.getElementById(`char-at-${c}-${r}`);
                hasKey = false;
                updateKeyUI();
                playChime(true);
            }
            break;
    }
    if(node) {
        node.remove();
        homePlan[r][c] = " ";
        flag = true;
    }
    return flag;
}

function doSomeAction() {
    let flag = false;
    if(x > 0) flag = makeAction(y, x - 1);
    if(!flag && x < homePlan[y].length - 1) flag = makeAction(y, x + 1);
    if(!flag && y > 0) flag = makeAction(y - 1, x);
    if(!flag && y < homePlan.length - 1) flag = makeAction(y + 1, x);
}

function moveBaby(dx, dy) {
    if (isGameOver) return;
    const newX = x + dx;
    const newY = y + dy;

    if (newX >= 0 && newX < homePlan[0].length && newY >= 0 && newY < homePlan.length) {
        const targetTile = homePlan[newY][newX];
        if (" m".includes(targetTile)) {
            x = newX;
            y = newY;
            baby.style.left = `${x * scale}px`;
            baby.style.top = `${y * scale}px`;

            const babyImg = baby.querySelector(".baby-avatar-img");
            if (babyImg) {
                if (dx < 0) {
                    babyImg.style.transform = "scaleX(-1)";
                } else if (dx > 0) {
                    babyImg.style.transform = "scaleX(1)";
                }
            }

            // Reach Milk
            if (targetTile === "m") {
                playChime(true);
                if (level < homePlans.length - 1) {
                    level++;
                    cleanupHome();
                    updateHome();
                } else {
                    isGameOver = true;
                    overlay.classList.add('active');
                }
            }
        }
    }
}

// Keyboard controls
window.addEventListener("keydown", (event) => {
    switch(event.key) {
        case "ArrowLeft":
        case "a":
        case "A":
            moveBaby(-1, 0);
            event.preventDefault();
            break;
        case "ArrowRight":
        case "d":
        case "D":
            moveBaby(1, 0);
            event.preventDefault();
            break;
        case "ArrowUp":
        case "w":
        case "W":
            moveBaby(0, -1);
            event.preventDefault();
            break;
        case "ArrowDown":
        case "s":
        case "S":
            moveBaby(0, 1);
            event.preventDefault();
            break;
        case " ":
            doSomeAction();
            event.preventDefault();
            break;
    }
});

replayBtn.addEventListener('click', () => {
    level = 0;
    isGameOver = false;
    overlay.classList.remove('active');
    cleanupHome();
    updateHome();
});

// Start game
updateHome();
</script>
</body>
