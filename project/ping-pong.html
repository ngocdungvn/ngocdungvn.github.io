<!doctype html>
<html lang="vi">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Bóng Bàn 2D Ping Pong | Retro Arcade</title>
	<link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">

	<style>
		:root {
			--bg: #090d16;
			--card-bg: rgba(22, 30, 49, 0.85);
			--card-border: rgba(255, 255, 255, 0.12);
			--primary: #38bdf8;
			--primary-glow: rgba(56, 189, 248, 0.35);
			--accent: #f43f5e;
			--text: #f8fafc;
			--text-muted: #94a3b8;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			-webkit-tap-highlight-color: transparent;
		}

		body {
			height: 100vh;
			width: 100vw;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: flex-start;
			font-family: 'Outfit', sans-serif;
			overflow: hidden;
			background: radial-gradient(circle at top center, #172554 0%, var(--bg) 100%);
			color: var(--text);
			touch-action: manipulation;
			padding: 10px;
		}

		/* Top Navigation Header */
		.top-header {
			width: 100%;
			max-width: 900px;
			display: flex;
			align-items: center;
			justify-content: center;
			margin-bottom: 8px;
			z-index: 20;
		}

		.game-badge {
			font-family: 'Press Start 2P', cursive;
			font-size: 0.7rem;
			color: var(--primary);
			text-shadow: 0 0 10px var(--primary-glow);
		}

		/* Scoreboard Header */
		.scoreboard-header {
			display: flex;
			flex-direction: row;
			justify-content: space-between;
			align-items: center;
			width: 100%;
			max-width: 900px;
			background: rgba(0, 0, 0, 0.4);
			border: 1px solid var(--card-border);
			border-radius: 16px;
			padding: 10px 20px;
			margin-bottom: 8px;
			z-index: 20;
		}

		.player-area {
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.player-name {
			font-size: 0.85rem;
			font-weight: 600;
			color: var(--text-muted);
			text-transform: uppercase;
		}

		.player-score {
			font-family: 'Press Start 2P', cursive;
			font-size: 1.3rem;
			color: var(--primary);
			min-width: 30px;
		}

		.player-score.ai {
			color: var(--accent);
		}

		.match-title {
			font-family: 'Press Start 2P', cursive;
			font-size: 0.8rem;
			color: #e2e8f0;
			text-align: center;
		}

		/* Arena Scale Viewport Wrapper */
		.arena-viewport {
			position: relative;
			flex: 1;
			width: 100%;
			max-width: 900px;
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
		}

		.arena-container {
			transform-origin: center center;
			transition: transform 0.1s ease-out;
		}

		.arena {
			border: 3px solid rgba(255, 255, 255, 0.2);
			width: 900px;
			height: 600px;
			background-color: #020617;
			border-radius: 16px;
			position: relative;
			box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9), 0 0 25px rgba(56, 189, 248, 0.15);
			overflow: hidden;
		}

		/* Middle net dashed line */
		.arena::after {
			content: '';
			position: absolute;
			left: 50%;
			top: 0;
			bottom: 0;
			width: 4px;
			background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.3) 0, rgba(255, 255, 255, 0.3) 15px, transparent 15px, transparent 30px);
			transform: translateX(-50%);
		}

		.player-left-paddle {
			position: absolute;
			left: 10px;
			top: 257.5px;
			width: 14px;
			height: 85px;
			background: #38bdf8;
			border-radius: 6px;
			box-shadow: 0 0 15px var(--primary-glow);
		}

		.player-right-paddle {
			position: absolute;
			right: 10px;
			top: 257.5px;
			width: 14px;
			height: 85px;
			background: #f43f5e;
			border-radius: 6px;
			box-shadow: 0 0 15px rgba(244, 63, 94, 0.5);
		}

		.ping-pong-ball {
			position: absolute;
			left: 442.5px;
			top: 292.5px;
			width: 15px;
			height: 15px;
			background-color: #ffffff;
			border-radius: 50%;
			box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
		}

		/* Modal Styles */
		.modal {
			position: absolute;
			inset: 0;
			background-color: rgba(9, 13, 22, 0.85);
			backdrop-filter: blur(8px);
			z-index: 50;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: opacity 0.2s ease;
		}

		.modal-content {
			width: 90%;
			max-width: 420px;
			background: var(--card-bg);
			border: 1px solid var(--card-border);
			border-radius: 24px;
			padding: 28px 20px;
			color: white;
			display: flex;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			text-align: center;
			box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
		}

		.modal-title {
			font-family: 'Press Start 2P', cursive;
			font-size: 1.1rem;
			color: var(--primary);
			margin-bottom: 12px;
		}

		.modal-desc {
			font-size: 0.9rem;
			color: var(--text-muted);
			margin-bottom: 20px;
			line-height: 1.5;
		}

		.btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			padding: 12px 28px;
			background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
			border: 1px solid rgba(255, 255, 255, 0.2);
			border-radius: 14px;
			color: white;
			font-family: 'Outfit', sans-serif;
			font-size: 1rem;
			font-weight: 700;
			cursor: pointer;
			box-shadow: 0 10px 25px -5px var(--primary-glow);
			transition: all 0.2s ease;
		}

		.btn:hover {
			filter: brightness(1.1);
			transform: translateY(-2px);
		}

		.btn:active {
			transform: translateY(1px);
		}

		.hide {
			display: none !important;
		}

		/* Mobile Touch Controls */
		.mobile-controls-bar {
			width: 100%;
			max-width: 900px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 8px 10px;
			margin-top: 4px;
			z-index: 20;
		}

		.control-group {
			display: flex;
			gap: 10px;
		}

		.touch-pad-btn {
			width: 62px;
			height: 50px;
			background: rgba(255, 255, 255, 0.08);
			border: 1px solid var(--card-border);
			border-radius: 14px;
			color: var(--text);
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 1.5rem;
			cursor: pointer;
			user-select: none;
			touch-action: none;
			transition: background 0.1s, transform 0.1s;
		}

		.touch-pad-btn:active, .touch-pad-btn.active {
			background: var(--primary);
			color: #020617;
			transform: scale(0.92);
			box-shadow: 0 0 15px var(--primary-glow);
		}

		.touch-pad-btn.right-player-btn:active, .touch-pad-btn.right-player-btn.active {
			background: var(--accent);
			color: white;
			box-shadow: 0 0 15px rgba(244, 63, 94, 0.5);
		}

		.mode-toggle-btn {
			padding: 8px 14px;
			background: rgba(255, 255, 255, 0.08);
			border: 1px solid var(--card-border);
			border-radius: 12px;
			color: var(--text-muted);
			font-size: 0.8rem;
			font-weight: 600;
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 6px;
			transition: all 0.2s;
		}

		.mode-toggle-btn.active {
			background: rgba(16, 185, 129, 0.2);
			border-color: #10b981;
			color: #34d399;
		}

		@media (max-width: 600px) {
			.match-title {
				display: none;
			}
			.player-name {
				font-size: 0.75rem;
			}
			.player-score {
				font-size: 1.1rem;
			}
		}
	</style>
</head>

<body>
	<!-- Top Navigation Header -->
	<header class="top-header">
		<span class="game-badge">PING PONG 2D</span>
	</header>

	<!-- Scoreboard -->
	<div class="scoreboard-header">
		<article class="player-area left-player">
			<span class="player-name">Bạn (P1):</span>
			<strong id="score1" class="player-score">0</strong>
		</article>

		<h1 class="match-title">Chạm 5 để thắng</h1>

		<article class="player-area right-player">
			<span class="player-name" id="p2Label">Máy (AI):</span>
			<strong id="score2" class="player-score ai">0</strong>
		</article>
	</div>

	<!-- Arena Viewport & Scaling Container -->
	<div class="arena-viewport">
		<div class="arena-container" id="arenaContainer">
			<main class="arena" id="arena">
				<section id="paddle1" class="player-left-paddle"></section>
				<section id="ball" class="ping-pong-ball"></section>
				<section id="paddle2" class="player-right-paddle"></section>
			</main>
		</div>

		<!-- Start & Game Over Modal -->
		<section id="modal" class="modal">
			<div class="modal-content">
				<div id="startGameContainer">
					<h2 class="modal-title">BÓNG BÀN RETRO</h2>
					<p class="modal-desc" id="startDesc">Di chuyển vợt để đỡ bóng và ghi 5 điểm trước đối thủ.</p>
					<button id="btnStart" class="btn">
						<i class="uil uil-play"></i> Bắt Đầu Chơi
					</button>
				</div>

				<div id="endGameContainer" class="hide">
					<h2 class="modal-title" id="winnerParagraph">P1 Thắng!</h2>
					<p class="modal-desc">Trận đấu đã kết thúc với tỉ số tuyệt vời.</p>
					<button id="restart" class="btn">
						<i class="uil uil-redo"></i> Chơi Lại
					</button>
				</div>
			</div>
		</section>
	</div>

	<!-- Mobile Touch Controls Bar -->
	<div class="mobile-controls-bar">
		<!-- Left Paddle Controls -->
		<div class="control-group">
			<button class="touch-pad-btn" id="btnP1Up" aria-label="P1 Lên"><i class="uil uil-angle-up"></i></button>
			<button class="touch-pad-btn" id="btnP1Down" aria-label="P1 Xuống"><i class="uil uil-angle-down"></i></button>
		</div>

		<!-- AI Bot Toggle -->
		<button class="mode-toggle-btn active" id="btnToggleAi">
			<i class="uil uil-robot"></i> Đấu Máy: BẬT
		</button>

		<!-- Right Paddle Controls (Hidden in AI mode) -->
		<div class="control-group hide" id="p2Controls">
			<button class="touch-pad-btn right-player-btn" id="btnP2Up" aria-label="P2 Lên"><i class="uil uil-angle-up"></i></button>
			<button class="touch-pad-btn right-player-btn" id="btnP2Down" aria-label="P2 Xuống"><i class="uil uil-angle-down"></i></button>
		</div>
	</div>

	};

	const winningScore = 5;
	const arenaBottomHeight = 600;
	const arenaWidth = 900;
	const paddleHeight = 85;
	const paddleWidth = 14;
	const ballRadius = 15;

	let speedOfPaddle1 = 0;
	let positionOfPaddle1 = (arenaBottomHeight / 2 - paddleHeight / 2);
	let speedOfPaddle2 = 0;
	let positionOfPaddle2 = (arenaBottomHeight / 2 - paddleHeight / 2);

	let topPositionOfBall = 292.5;
	let leftPositionOfBall = 442.5;
	let topSpeedOfBall = 0;
	let leftSpeedOfBall = 0;
	const speedConstant = 9;

	let score1 = 0;
	let score2 = 0;
	let side = 1;
	let isPlaying = false;
	let isAiOpponent = true; // Default: P2 is AI bot

	const scoreAudio = new Audio(AUDIOS.scoreAudio);
	const wallBounceAudio = new Audio(AUDIOS.wallBounceAudio);
	const paddleBounceAudio = new Audio(AUDIOS.paddleBounceAudio);
	const victoryAudio = new Audio(AUDIOS.victoryAudio);

	function playSound(audio) {
		audio.currentTime = 0;
		audio.play().catch(() => {});
	}

	// Auto-resize arena to fit screen
	const arenaContainer = document.getElementById('arenaContainer');
	function resizeArena() {
		const padY = window.innerWidth <= 600 ? 160 : 180;
		const scaleX = (window.innerWidth - 20) / 900;
		const scaleY = (window.innerHeight - padY) / 600;
		const scale = Math.max(0.35, Math.min(1, scaleX, scaleY));
		arenaContainer.style.transform = `scale(${scale})`;
	}
	window.addEventListener('resize', resizeArena);
	resizeArena();

	const startBall = () => {
		topPositionOfBall = (arenaBottomHeight / 2 - (ballRadius / 2));
		leftPositionOfBall = (arenaWidth / 2 - (ballRadius / 2));
		side = Math.random() < 0.5 ? 1 : -1;
		topSpeedOfBall = (Math.random() > 0.5 ? 1 : -1) * (speedConstant * 0.75);
		leftSpeedOfBall = side * speedConstant;
	};

	// AI Logic for Player 2
	function updateAi() {
		if (!isAiOpponent || !isPlaying) return;
		// If ball is heading right, track it
		if (leftSpeedOfBall > 0) {
			const targetY = topPositionOfBall - paddleHeight / 2 + 5;
			const diff = targetY - positionOfPaddle2;
			if (Math.abs(diff) > 8) {
				positionOfPaddle2 += Math.sign(diff) * (speedConstant * 0.72);
			}
		} else {
			// Center paddle gradually
			const targetY = (arenaBottomHeight - paddleHeight) / 2;
			const diff = targetY - positionOfPaddle2;
			if (Math.abs(diff) > 5) {
				positionOfPaddle2 += Math.sign(diff) * 2;
			}
		}
		// Clamp inside arena
		positionOfPaddle2 = Math.max(0, Math.min(arenaBottomHeight - paddleHeight, positionOfPaddle2));
	}

	const gameLoop = () => {
		if (!isPlaying) return;

		// Move ball
		topPositionOfBall += topSpeedOfBall;
		leftPositionOfBall += leftSpeedOfBall;

		// Move Paddle 1
		positionOfPaddle1 += speedOfPaddle1;
		positionOfPaddle1 = Math.max(0, Math.min(arenaBottomHeight - paddleHeight, positionOfPaddle1));

		// Move Paddle 2 if not AI
		if (!isAiOpponent) {
			positionOfPaddle2 += speedOfPaddle2;
			positionOfPaddle2 = Math.max(0, Math.min(arenaBottomHeight - paddleHeight, positionOfPaddle2));
		} else {
			updateAi();
		}

		// Bounce top / bottom walls
		if (topPositionOfBall <= 0) {
			topPositionOfBall = 0;
			topSpeedOfBall = Math.abs(topSpeedOfBall);
			playSound(wallBounceAudio);
		} else if (topPositionOfBall >= arenaBottomHeight - ballRadius) {
			topPositionOfBall = arenaBottomHeight - ballRadius;
			topSpeedOfBall = -Math.abs(topSpeedOfBall);
			playSound(wallBounceAudio);
		}

		// Paddle 1 Collision (Left)
		if (leftPositionOfBall <= 10 + paddleWidth) {
			if (topPositionOfBall + ballRadius >= positionOfPaddle1 && topPositionOfBall <= positionOfPaddle1 + paddleHeight) {
				leftPositionOfBall = 10 + paddleWidth;
				leftSpeedOfBall = Math.abs(leftSpeedOfBall) * 1.03; // slight speed up
				// Angle ball based on where it hit the paddle
				const hitOffset = (topPositionOfBall + ballRadius / 2) - (positionOfPaddle1 + paddleHeight / 2);
				topSpeedOfBall = (hitOffset / (paddleHeight / 2)) * speedConstant;
				playSound(paddleBounceAudio);
			} else if (leftPositionOfBall <= 0) {
				score2++;
				handlePointScored();
			}
		}

		// Paddle 2 Collision (Right)
		if (leftPositionOfBall >= arenaWidth - 10 - paddleWidth - ballRadius) {
			if (topPositionOfBall + ballRadius >= positionOfPaddle2 && topPositionOfBall <= positionOfPaddle2 + paddleHeight) {
				leftPositionOfBall = arenaWidth - 10 - paddleWidth - ballRadius;
				leftSpeedOfBall = -Math.abs(leftSpeedOfBall) * 1.03;
				const hitOffset = (topPositionOfBall + ballRadius / 2) - (positionOfPaddle2 + paddleHeight / 2);
				topSpeedOfBall = (hitOffset / (paddleHeight / 2)) * speedConstant;
				playSound(paddleBounceAudio);
			} else if (leftPositionOfBall >= arenaWidth - ballRadius) {
				score1++;
				handlePointScored();
			}
		}

		// Render DOM positions
		document.getElementById('paddle1').style.top = positionOfPaddle1 + 'px';
		document.getElementById('paddle2').style.top = positionOfPaddle2 + 'px';
		document.getElementById('ball').style.top = topPositionOfBall + 'px';
		document.getElementById('ball').style.left = leftPositionOfBall + 'px';
		document.getElementById('score1').textContent = score1;
		document.getElementById('score2').textContent = score2;
	};

	let gameInterval = setInterval(gameLoop, 20);

	function handlePointScored() {
		playSound(scoreAudio);
		document.getElementById('score1').textContent = score1;
		document.getElementById('score2').textContent = score2;

		if (score1 >= winningScore || score2 >= winningScore) {
			triggerVictory();
		} else {
			startBall();
		}
	}

	function triggerVictory() {
		isPlaying = false;
		playSound(victoryAudio);

		const modal = document.getElementById('modal');
		const startContainer = document.getElementById('startGameContainer');
		const endContainer = document.getElementById('endGameContainer');
		const winnerText = document.getElementById('winnerParagraph');

		startContainer.classList.add('hide');
		endContainer.classList.remove('hide');
		modal.classList.remove('hide');

		if (score1 >= winningScore) {
			winnerText.textContent = 'Bạn (P1) Chiến Thắng! 🎉';
			winnerText.style.color = '#38bdf8';
		} else {
			winnerText.textContent = isAiOpponent ? 'Máy (AI) Thắng! 🤖' : 'P2 Chiến Thắng! 🏆';
			winnerText.style.color = '#f43f5e';
		}
	}

	function startMatch() {
		score1 = 0;
		score2 = 0;
		document.getElementById('score1').textContent = '0';
		document.getElementById('score2').textContent = '0';
		positionOfPaddle1 = (arenaBottomHeight - paddleHeight) / 2;
		positionOfPaddle2 = (arenaBottomHeight - paddleHeight) / 2;

		document.getElementById('modal').classList.add('hide');
		startBall();
		isPlaying = true;
	}

	// Keyboard Handlers (WASD + Arrows)
	document.addEventListener('keydown', (e) => {
		if (e.key === 'Enter') {
			if (!isPlaying) startMatch();
		}
		if (e.key === 'w' || e.key === 'W') speedOfPaddle1 = -speedConstant;
		if (e.key === 's' || e.key === 'S') speedOfPaddle1 = speedConstant;

		if (!isAiOpponent) {
			if (e.key === 'ArrowUp') speedOfPaddle2 = -speedConstant;
			if (e.key === 'ArrowDown') speedOfPaddle2 = speedConstant;
		}
	});

	document.addEventListener('keyup', (e) => {
		if (e.key === 'w' || e.key === 'W' || e.key === 's' || e.key === 'S') speedOfPaddle1 = 0;
		if (!isAiOpponent) {
			if (e.key === 'ArrowUp' || e.key === 'ArrowDown') speedOfPaddle2 = 0;
		}
	});

	// Touch Controls binding
	const bindTouch = (btn, onDown, onUp) => {
		const handleDown = (e) => {
			e.preventDefault();
			btn.classList.add('active');
			onDown();
		};
		const handleUp = (e) => {
			e.preventDefault();
			btn.classList.remove('active');
			onUp();
		};
		btn.addEventListener('touchstart', handleDown, { passive: false });
		btn.addEventListener('touchend', handleUp, { passive: false });
		btn.addEventListener('mousedown', handleDown);
		btn.addEventListener('mouseup', handleUp);
		btn.addEventListener('mouseleave', handleUp);
	};

	bindTouch(document.getElementById('btnP1Up'), () => speedOfPaddle1 = -speedConstant, () => speedOfPaddle1 = 0);
	bindTouch(document.getElementById('btnP1Down'), () => speedOfPaddle1 = speedConstant, () => speedOfPaddle1 = 0);
	bindTouch(document.getElementById('btnP2Up'), () => speedOfPaddle2 = -speedConstant, () => speedOfPaddle2 = 0);
	bindTouch(document.getElementById('btnP2Down'), () => speedOfPaddle2 = speedConstant, () => speedOfPaddle2 = 0);

	// Touch Drag directly on Arena (seamless mobile touch paddle movement)
	const arenaEl = document.getElementById('arena');
	let isDragging = false;

	const handleArenaTouch = (e) => {
		if (!isPlaying) return;
		const touch = e.touches ? e.touches[0] : e;
		const rect = arenaEl.getBoundingClientRect();
		const relativeY = (touch.clientY - rect.top) * (600 / rect.height);
		positionOfPaddle1 = Math.max(0, Math.min(arenaBottomHeight - paddleHeight, relativeY - paddleHeight / 2));
	};

	arenaEl.addEventListener('touchstart', (e) => {
		isDragging = true;
		handleArenaTouch(e);
	}, { passive: true });

	arenaEl.addEventListener('touchmove', (e) => {
		if (isDragging) handleArenaTouch(e);
	}, { passive: true });

	arenaEl.addEventListener('touchend', () => isDragging = false);

	// AI Toggle button
	const btnToggleAi = document.getElementById('btnToggleAi');
	const p2Controls = document.getElementById('p2Controls');
	const p2Label = document.getElementById('p2Label');

	btnToggleAi.addEventListener('click', () => {
		isAiOpponent = !isAiOpponent;
		if (isAiOpponent) {
			btnToggleAi.classList.add('active');
			btnToggleAi.innerHTML = '<i class="uil uil-robot"></i> Đấu Máy: BẬT';
			p2Controls.classList.add('hide');
			p2Label.textContent = 'Máy (AI):';
		} else {
			btnToggleAi.classList.remove('active');
			btnToggleAi.innerHTML = '<i class="uil uil-users-alt"></i> Chơi 2 Người';
			p2Controls.classList.remove('hide');
			p2Label.textContent = 'Người 2:';
		}
	});

	// Modal Buttons
	document.getElementById('btnStart').addEventListener('click', startMatch);
	document.getElementById('restart').addEventListener('click', startMatch);
</script>
</body>
