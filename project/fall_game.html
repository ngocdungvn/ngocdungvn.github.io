<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fall Game | Trò Chơi Thả Rơi Tự Do</title>
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(26, 31, 51, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --primary: #8b5cf6;
      --primary-glow: rgba(139, 92, 246, 0.4);
      --accent: #ec4899;
      --ball-color: #f43f5e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top center, #1e1b4b 0%, var(--bg) 100%);
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* Top Navigation Header */
    .top-header {
      width: 100%;
      max-width: 440px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .game-badge {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.65rem;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(236, 72, 153, 0.4);
    }

    /* Game Container */
    .game-wrapper {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 16px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Scoreboard */
    .scoreboard {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 10px 16px;
      margin-bottom: 12px;
    }

    .score-box {
      display: flex;
      flex-direction: column;
    }

    .score-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .score-val {
      font-family: 'Press Start 2P', monospace;
      font-size: 1.1rem;
      color: #38bdf8;
      margin-top: 4px;
    }

    .score-val.high {
      color: #fbbf24;
    }

    /* Fall Game Board */
    .board-container {
      position: relative;
      width: 100%;
      max-width: 380px;
      height: 480px;
      border: 2px solid rgba(139, 92, 246, 0.4);
      border-radius: 18px;
      background: #060913;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(139, 92, 246, 0.15);
    }

    #character {
      width: 20px;
      height: 20px;
      background: radial-gradient(circle at 30% 30%, #ff6b81, #ee5253);
      border-radius: 50%;
      position: absolute;
      top: 380px;
      left: 180px;
      z-index: 5;
      box-shadow: 0 0 10px rgba(238, 82, 83, 0.8);
      transition: left 0.02s linear;
    }

    .block {
      width: 100%;
      height: 18px;
      background: linear-gradient(90deg, #334155, #475569, #334155);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      border-bottom: 1px solid rgba(0, 0, 0, 0.4);
      position: absolute;
      top: 100px;
      z-index: 1;
    }

    .hole {
      width: 48px;
      height: 18px;
      background-color: #060913;
      position: absolute;
      top: 100px;
      z-index: 2;
      box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.9);
    }

    /* Overlay Modal */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 15, 25, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 10;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-title {
      font-family: 'Press Start 2P', cursive;
      font-size: 1.15rem;
      color: var(--accent);
      margin-bottom: 12px;
      text-shadow: 0 0 15px rgba(236, 72, 153, 0.6);
    }

    .overlay-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px var(--primary-glow);
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    /* Touch Controls */
    .touch-controls {
      width: 100%;
      max-width: 380px;
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }

    .touch-btn {
      flex: 1;
      height: 56px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 700;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      touch-action: none;
      transition: all 0.15s ease;
    }

    .touch-btn:active, .touch-btn.active {
      background: var(--primary);
      color: #fff;
      transform: scale(0.95);
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .instructions {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="top-header">
    <span class="game-badge">FALL GAME</span>
  </header>

  <!-- Main Game Card -->
  <main class="game-wrapper">
    <!-- Scoreboard -->
    <div class="scoreboard">
      <div class="score-box">
        <span class="score-label">Điểm số</span>
        <span class="score-val" id="currentScore">0</span>
      </div>
      <div class="score-box" style="align-items: flex-end;">
        <span class="score-label">Kỷ lục</span>
        <span class="score-val high" id="highScore">0</span>
      </div>
    </div>

    <!-- Game Board -->
    <div class="board-container" id="game">
      <div id="character"></div>

      <!-- Overlay Game Over -->
      <div class="overlay" id="gameOverOverlay">
        <h2 class="overlay-title">GAME OVER</h2>
        <p class="overlay-desc">Bạn đạt được <span id="finalScore" style="color: #38bdf8; font-weight: 700;">0</span> tầng!</p>
        <button class="btn-action" id="restartBtn">
          <i class="uil uil-redo"></i> Chơi Lại
        </button>
      </div>
    </div>

    <!-- Ergonomic Touch Controls for Mobile -->
    <div class="touch-controls">
      <button class="touch-btn" id="btnLeft">
        <i class="uil uil-angle-left"></i> Trái
      </button>
      <button class="touch-btn" id="btnRight">
        Phải <i class="uil uil-angle-right"></i>
      </button>
    </div>

    <p class="instructions">Dùng phím Mũi tên Trái / Phải hoặc A / D • Chạm giữ nút trên điện thoại</p>
  </main>

  <script>
    const character = document.getElementById('character');
    const game = document.getElementById('game');
    const currentScoreEl = document.getElementById('currentScore');
    const highScoreEl = document.getElementById('highScore');
    const finalScoreEl = document.getElementById('finalScore');
    const overlay = document.getElementById('gameOverOverlay');
    const restartBtn = document.getElementById('restartBtn');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');

    let moveInterval = null;
    let both = 0;
    let counter = 0;
    let currentBlocks = [];
    let gameLoopInterval = null;
    let isGameOver = false;

    // High score
    let high = parseInt(localStorage.getItem('fall_game_high_score') || '0', 10);
    highScoreEl.textContent = high;

    function getBoardWidth() {
      return game.clientWidth;
    }

    function moveLeft() {
      let left = parseInt(window.getComputedStyle(character).getPropertyValue("left"));
      if (left > 0) {
        character.style.left = Math.max(0, left - 4) + "px";
      }
    }

    function moveRight() {
      let left = parseInt(window.getComputedStyle(character).getPropertyValue("left"));
      const maxLeft = getBoardWidth() - 20;
      if (left < maxLeft) {
        character.style.left = Math.min(maxLeft, left + 4) + "px";
      }
    }

    function startMoving(direction) {
      if (both === 0 && !isGameOver) {
        both++;
        if (direction === "left") {
          btnLeft.classList.add('active');
          moveInterval = setInterval(moveLeft, 10);
        } else if (direction === "right") {
          btnRight.classList.add('active');
          moveInterval = setInterval(moveRight, 10);
        }
      }
    }

    function stopMoving() {
      clearInterval(moveInterval);
      btnLeft.classList.remove('active');
      btnRight.classList.remove('active');
      both = 0;
    }

    // Keyboard support
    document.addEventListener("keydown", event => {
      if (isGameOver) {
        if (event.key === "Enter" || event.code === "Space") {
          startGame();
        }
        return;
      }
      if (event.key === "ArrowLeft" || event.key === "a" || event.key === "A") {
        startMoving("left");
      }
      if (event.key === "ArrowRight" || event.key === "d" || event.key === "D") {
        startMoving("right");
      }
    });

    document.addEventListener("keyup", event => {
      stopMoving();
    });

    // Touch support for Mobile
    const bindTouch = (btn, dir) => {
      const handleStart = (e) => {
        e.preventDefault();
        startMoving(dir);
      };
      const handleEnd = (e) => {
        e.preventDefault();
        stopMoving();
      };
      btn.addEventListener("touchstart", handleStart, { passive: false });
      btn.addEventListener("touchend", handleEnd, { passive: false });
      btn.addEventListener("mousedown", handleStart);
      btn.addEventListener("mouseup", handleEnd);
      btn.addEventListener("mouseleave", handleEnd);
    };

    bindTouch(btnLeft, "left");
    bindTouch(btnRight, "right");

    function triggerGameOver() {
      isGameOver = true;
      clearInterval(gameLoopInterval);
      stopMoving();

      const score = Math.max(0, counter - 9);
      finalScoreEl.textContent = score;

      if (score > high) {
        high = score;
        localStorage.setItem('fall_game_high_score', high);
        highScoreEl.textContent = high;
      }

      overlay.classList.add('active');
    }

    function startGame() {
      // Clear existing blocks
      currentBlocks.forEach(id => {
        const b = document.getElementById("block" + id);
        const h = document.getElementById("hole" + id);
        if (b) b.remove();
        if (h) h.remove();
      });

      clearInterval(gameLoopInterval);
      stopMoving();

      counter = 0;
      currentBlocks = [];
      isGameOver = false;
      overlay.classList.remove('active');

      const boardWidth = getBoardWidth();
      character.style.top = "380px";
      character.style.left = (boardWidth / 2 - 10) + "px";
      currentScoreEl.textContent = "0";

      gameLoopInterval = setInterval(() => {
        if (isGameOver) return;

        const boardWidth = getBoardWidth();
        const blockLast = document.getElementById("block" + (counter - 1));
        const holeLast = document.getElementById("hole" + (counter - 1));

        let blockLastTop = 0;
        let holeLastTop = 0;
        if (counter > 0 && blockLast && holeLast) {
          blockLastTop = parseInt(window.getComputedStyle(blockLast).getPropertyValue("top"));
          holeLastTop = parseInt(window.getComputedStyle(holeLast).getPropertyValue("top"));
        }

        if (blockLastTop < 380 || counter === 0) {
          const block = document.createElement("div");
          const hole = document.createElement("div");
          block.setAttribute("class", "block");
          hole.setAttribute("class", "hole");
          block.setAttribute("id", "block" + counter);
          hole.setAttribute("id", "hole" + counter);

          block.style.top = (blockLastTop + 95) + "px";
          hole.style.top = (holeLastTop + 95) + "px";

          // Random hole position within board width
          const maxHoleLeft = boardWidth - 52;
          const random = Math.floor(Math.random() * Math.max(10, maxHoleLeft));
          hole.style.left = random + "px";

          game.appendChild(block);
          game.appendChild(hole);
          currentBlocks.push(counter);
          counter++;

          const score = Math.max(0, counter - 9);
          currentScoreEl.textContent = score;
        }

        const characterTop = parseInt(window.getComputedStyle(character).getPropertyValue("top"));
        const characterLeft = parseInt(window.getComputedStyle(character).getPropertyValue("left"));
        let drop = 0;

        if (characterTop <= 0) {
          triggerGameOver();
          return;
        }

        for (let i = 0; i < currentBlocks.length; i++) {
          const current = currentBlocks[i];
          const iBlock = document.getElementById("block" + current);
          const iHole = document.getElementById("hole" + current);

          if (!iBlock || !iHole) continue;

          const iblockTop = parseFloat(window.getComputedStyle(iBlock).getPropertyValue("top"));
          const iholeLeft = parseFloat(window.getComputedStyle(iHole).getPropertyValue("left"));

          // Move up
          iBlock.style.top = (iblockTop - 1.2) + "px";
          iHole.style.top = (iblockTop - 1.2) + "px";

          if (iblockTop < -20) {
            currentBlocks.shift();
            iBlock.remove();
            iHole.remove();
          }

          // Check if ball is on the block
          if (iblockTop - 20 < characterTop && iblockTop > characterTop) {
            drop++;
            // Check if ball is inside the hole
            if (iholeLeft <= characterLeft && iholeLeft + 36 >= characterLeft) {
              drop = 0;
            }
          }
        }

        if (drop === 0) {
          if (characterTop < 450) {
            character.style.top = (characterTop + 3) + "px";
          }
        } else {
          character.style.top = (characterTop - 1.2) + "px";
        }
      }, 16);
    }

    restartBtn.addEventListener("click", startGame);

    // Initialize game
    window.addEventListener("load", startGame);
  </script>
</body>
</html>
