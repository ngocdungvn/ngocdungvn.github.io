<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="author" content="Tạ Ngọc Dũng" />

  <meta property="og:type" content="website" />

  <meta property="og:title" content="Thổi Nến Sinh Nhật Online | Happy Birthday Cake" />
  <meta property="og:description" content="Chiếc bánh kem sinh nhật 2D nghệ thuật lung linh ấm áp: Thổi nến ước nguyện, thắp lại nến và gửi thiệp chúc mừng sinh nhật." />
  <meta property="og:image" content="https://ngocdungvn.github.io/assets/img/og-cover.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #120722;
      --gold-accent: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.4);
      --pink-accent: #f43f5e;
      --card-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background-color: var(--bg-dark);
      color: #ffffff;
    }

    /* Khung cảnh nền dạ tiệc sinh nhật lung linh */
    body {
      position: relative;
      background:
        radial-gradient(circle at 50% 48%, rgba(244, 63, 94, 0.22) 0%, transparent 60%),
        radial-gradient(circle at 20% 20%, rgba(168, 85, 247, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 80% 30%, rgba(245, 158, 11, 0.20) 0%, transparent 55%),
        linear-gradient(180deg, #1a0a30 0%, #120522 60%, #0a0214 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Canvas pháo hoa giấy confetti */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }

    /* Các đốm sáng bokeh lơ lửng mềm mại */
    .bokeh-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .bokeh {
      position: absolute;
      border-radius: 50%;
      filter: blur(24px);
      opacity: 0.18;
      animation: floatBokeh 14s infinite ease-in-out alternate;
    }

    @keyframes floatBokeh {
      0% { transform: translate(0, 0) scale(1); opacity: 0.12; }
      50% { opacity: 0.28; }
      100% { transform: translate(35px, -45px) scale(1.3); opacity: 0.16; }
    }

    /* Dây cờ đuôi nheo (Bunting banner) trên đỉnh */
    .bunting-svg {
      position: absolute;
      top: -6px;
      left: 0;
      width: 100%;
      height: 100px;
      pointer-events: none;
      z-index: 10;
    }

    /* Chùm bóng bay 2 bên */
    .balloon-cluster {
      position: absolute;
      top: 12%;
      pointer-events: none;
      z-index: 8;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.6s ease;
    }

    .balloon-cluster.left {
      left: 4%;
      animation: floatBalloon 6s ease-in-out infinite alternate;
    }

    .balloon-cluster.right {
      right: 4%;
      animation: floatBalloon 7s ease-in-out 1s infinite alternate-reverse;
    }

    @keyframes floatBalloon {
      0% { transform: translateY(0px) rotate(-1.5deg); }
      100% { transform: translateY(-18px) rotate(2deg); }
    }

    @media (max-width: 860px) {
      .balloon-cluster {
        display: none;
      }
    }

    /* Vùng chứa sân khấu bánh sinh nhật */
    .stage-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 15;
      padding: 12px;
      overflow: hidden;
    }

    /* Tiêu đề & Lời chúc mừng sinh nhật */
    .title-banner {
      text-align: center;
      margin-bottom: 4px;
      pointer-events: none;
      z-index: 20;
      max-width: 96vw;
    }

    .sub-greeting {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fcd34d;
      text-shadow: 0 0 12px rgba(251, 191, 36, 0.6);
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .main-title {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(30px, 7.5vw, 64px);
      font-weight: 700;
      line-height: 1.15;
      background: linear-gradient(135deg, #fff7ed 0%, #fed7aa 40%, #f472b6 75%, #fb7185 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 18px rgba(244, 63, 94, 0.45));
      word-break: break-word;
    }

    .custom-message {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(14px, 2.2vw, 18px);
      color: #fbcfe8;
      margin-top: 4px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      max-width: 90vw;
      padding: 0 8px;
      min-height: 22px;
    }

    /* Khung hiển thị bánh sinh nhật (SVG 2D tương tác) */
    .cake-wrapper {
      position: relative;
      width: min(92vw, 540px);
      max-width: 100%;
      max-height: 52vh;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      min-width: 0;
    }

    .cake-wrapper:hover {
      transform: scale(1.02);
    }

    .cake-wrapper:active {
      transform: scale(0.985);
    }

    .cake-svg {
      width: 100%;
      max-width: 100%;
      height: auto;
      max-height: 48vh;
      flex-shrink: 1;
      display: block;
      overflow: visible;
      filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.55));
    }

    /* Hiệu ứng ngọn lửa nến lung linh sống động */
    .flame-element {
      transform-origin: 0px 0px;
      animation: candleFlicker 1.4s ease-in-out infinite alternate;
      cursor: pointer;
      filter: drop-shadow(0 0 10px rgba(254, 215, 60, 0.95)) drop-shadow(0 0 22px rgba(249, 115, 22, 0.7));
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .flame-element:nth-child(2n) {
      animation-duration: 1.1s;
      animation-delay: 0.15s;
    }

    .flame-element:nth-child(3n) {
      animation-duration: 1.6s;
      animation-delay: 0.3s;
    }

    @keyframes candleFlicker {
      0% {
        transform: scale(1) rotate(-1.5deg);
      }
      25% {
        transform: scale(1.06, 0.94) rotate(2deg) skewX(1deg);
      }
      50% {
        transform: scale(0.96, 1.05) rotate(-2deg);
      }
      75% {
        transform: scale(1.04, 0.97) rotate(1deg);
      }
      100% {
        transform: scale(0.98, 1.02) rotate(-0.5deg);
      }
    }

    /* Vệt khói bốc lên khi nến tắt */
    .smoke-puff {
      opacity: 0;
      transform-origin: center bottom;
      pointer-events: none;
    }

    .smoke-puff.blown {
      animation: smokeRise 1.8s ease-out forwards;
    }

    @keyframes smokeRise {
      0% {
        opacity: 0.75;
        transform: translateY(0) scale(0.6) rotate(0deg);
      }
      50% {
        opacity: 0.45;
        transform: translateY(-22px) scale(1.2) rotate(15deg);
      }
      100% {
        opacity: 0;
        transform: translateY(-48px) scale(1.8) rotate(-25deg);
      }
    }

    @media (max-width: 600px) {
      .bunting-svg {
        height: 65px;
      }

      .stage-container {
        padding: 6px 8px;
        justify-content: center;
        gap: 14px;
      }

      .title-banner {
        margin-bottom: 2px;
      }

      .sub-greeting {
        font-size: 11px;
        letter-spacing: 2px;
      }

      .main-title {
        font-size: clamp(26px, 7.5vw, 36px);
      }

      .custom-message {
        font-size: 13px;
        margin-top: 2px;
        min-height: 18px;
      }

      .cake-wrapper {
        width: min(92vw, 420px);
        max-height: 52vh;
      }

      .cake-svg {
        max-height: 48vh;
      }
    }
  </style>
</head>
<body>

  <!-- Canvas pháo giấy sinh nhật -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Đốm sáng bokeh lấp lánh trên nền tiệc sinh nhật -->
  <div class="bokeh-wrap" id="bokeh-container"></div>

  <!-- Dây cờ đuôi nheo tam giác sinh nhật (Bunting Garland) -->
  <svg class="bunting-svg" viewBox="0 0 1200 110" preserveAspectRatio="none">
    <defs>
      <filter id="garland-shadow" x="-10%" y="-10%" width="120%" height="130%">
        <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.35" />
      </filter>
    </defs>
    <!-- Dây cung treo cờ -->
    <path d="M 0,15 Q 300,75 600,60 Q 900,75 1200,15" fill="none" stroke="#fcd34d" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />
    <path d="M 0,35 Q 350,90 600,70 Q 850,90 1200,35" fill="none" stroke="#f472b6" stroke-width="1.6" stroke-linecap="round" opacity="0.65" />

    <!-- Dàn cờ tam giác đuôi nheo nhiều màu sinh nhật -->
    <g filter="url(#garland-shadow)">
      <polygon points="40,20 85,25 62,85" fill="#f43f5e" />
      <polygon points="120,29 165,34 142,92" fill="#fbbf24" />
      <polygon points="200,38 245,43 222,100" fill="#38bdf8" />
      <polygon points="280,47 325,51 302,106" fill="#a855f7" />
      <polygon points="360,54 405,57 382,108" fill="#4ade80" />
      <polygon points="440,59 485,61 462,110" fill="#f43f5e" />
      <polygon points="520,61 565,60 542,109" fill="#fb923c" />
      <polygon points="600,60 645,61 622,109" fill="#facc15" />
      <polygon points="680,60 725,58 702,108" fill="#2dd4bf" />
      <polygon points="760,57 805,53 782,105" fill="#ec4899" />
      <polygon points="840,51 885,46 862,100" fill="#818cf8" />
      <polygon points="920,43 965,37 942,93" fill="#f59e0b" />
      <polygon points="1000,34 1045,28 1022,86" fill="#fb7185" />
      <polygon points="1080,25 1125,19 1102,77" fill="#34d399" />
    </g>
  </svg>

  <!-- Chùm bóng bay pastel sinh nhật 2 bên cánh gà -->
  <div class="balloon-cluster left">
    <svg width="170" height="320" viewBox="0 0 170 320">
      <defs>
        <radialGradient id="balloon-pink" cx="35%" cy="30%" r="65%">
          <stop offset="0%" stop-color="#fda4af"/>
          <stop offset="50%" stop-color="#f43f5e"/>
          <stop offset="100%" stop-color="#be123c"/>
        </radialGradient>
        <radialGradient id="balloon-gold" cx="35%" cy="30%" r="65%">
          <stop offset="0%" stop-color="#fef08a"/>
          <stop offset="50%" stop-color="#f59e0b"/>
          <stop offset="100%" stop-color="#b45309"/>
        </radialGradient>
        <radialGradient id="balloon-purple" cx="35%" cy="30%" r="65%">
          <stop offset="0%" stop-color="#e9d5ff"/>
          <stop offset="50%" stop-color="#a855f7"/>
          <stop offset="100%" stop-color="#6b21a8"/>
        </radialGradient>
      </defs>
      <!-- Dây bóng bay -->
      <path d="M 50,110 Q 70,180 85,310" stroke="#fcd34d" stroke-width="1.5" fill="none" opacity="0.6"/>
      <path d="M 115,100 Q 100,190 85,310" stroke="#fcd34d" stroke-width="1.5" fill="none" opacity="0.6"/>
      <path d="M 80,65 Q 82,180 85,310" stroke="#fcd34d" stroke-width="1.5" fill="none" opacity="0.6"/>

      <!-- Quả bóng tím phía sau -->
      <ellipse cx="115" cy="85" rx="36" ry="46" fill="url(#balloon-purple)"/>
      <polygon points="112,130 118,130 115,135" fill="#a855f7"/>
      <ellipse cx="104" cy="65" rx="8" ry="14" fill="#ffffff" opacity="0.4" transform="rotate(-20 104 65)"/>

      <!-- Quả bóng vàng giữa -->
      <ellipse cx="50" cy="95" rx="38" ry="48" fill="url(#balloon-gold)"/>
      <polygon points="47,142 53,142 50,147" fill="#f59e0b"/>
      <ellipse cx="38" cy="74" rx="9" ry="15" fill="#ffffff" opacity="0.45" transform="rotate(-20 38 74)"/>

      <!-- Quả bóng hồng nổi bật phía trước -->
      <ellipse cx="80" cy="55" rx="42" ry="52" fill="url(#balloon-pink)"/>
      <polygon points="76,106 84,106 80,112" fill="#f43f5e"/>
      <ellipse cx="68" cy="35" rx="10" ry="16" fill="#ffffff" opacity="0.5" transform="rotate(-20 68 35)"/>
    </svg>
  </div>

  <div class="balloon-cluster right">
    <svg width="170" height="320" viewBox="0 0 170 320">
      <defs>
        <radialGradient id="balloon-cyan" cx="35%" cy="30%" r="65%">
          <stop offset="0%" stop-color="#bae6fd"/>
          <stop offset="50%" stop-color="#0ea5e9"/>
          <stop offset="100%" stop-color="#0369a1"/>
        </radialGradient>
      </defs>
      <!-- Dây bóng bay -->
      <path d="M 60,95 Q 75,190 85,310" stroke="#fcd34d" stroke-width="1.5" fill="none" opacity="0.6"/>
      <path d="M 115,110 Q 95,190 85,310" stroke="#fcd34d" stroke-width="1.5" fill="none" opacity="0.6"/>
      <path d="M 90,60 Q 88,180 85,310" stroke="#fcd34d" stroke-width="1.5" fill="none" opacity="0.6"/>

      <!-- Quả bóng hồng phía sau -->
      <ellipse cx="60" cy="85" rx="36" ry="46" fill="url(#balloon-pink)"/>
      <polygon points="57,130 63,130 60,135" fill="#f43f5e"/>
      <ellipse cx="49" cy="65" rx="8" ry="14" fill="#ffffff" opacity="0.4" transform="rotate(-20 49 65)"/>

      <!-- Quả bóng cyan giữa -->
      <ellipse cx="115" cy="98" rx="38" ry="48" fill="url(#balloon-cyan)"/>
      <polygon points="112,145 118,145 115,150" fill="#0ea5e9"/>
      <ellipse cx="103" cy="77" rx="9" ry="15" fill="#ffffff" opacity="0.45" transform="rotate(-20 103 77)"/>

      <!-- Quả bóng vàng nổi bật phía trước -->
      <ellipse cx="90" cy="50" rx="42" ry="52" fill="url(#balloon-gold)"/>
      <polygon points="86,101 94,101 90,107" fill="#f59e0b"/>
      <ellipse cx="78" cy="30" rx="10" ry="16" fill="#ffffff" opacity="0.5" transform="rotate(-20 78 30)"/>
    </svg>
  </div>

  <!-- Vùng sân khấu chính -->
  <main class="stage-container">

    <!-- Lời chúc mừng sinh nhật -->
    <header class="title-banner">
      <div class="sub-greeting">
        <span>✨</span> Chúc Mừng Sinh Nhật <span>✨</span>
      </div>
      <h1 class="main-title" id="main_title_text">Happy Birthday to you!</h1>
      <p class="custom-message" id="message_text">Hãy ước một điều thật đẹp và nhấp thổi nến nhé!</p>
    </header>

    <!-- Khung Bánh Kem Sinh Nhật 2D Nghệ Thuật (Vector SVG) -->
    <div class="cake-wrapper" id="cake_click_area" title="Nhấp vào bánh để thổi nến hoặc thắp lại nến">
      <svg class="cake-svg" viewBox="0 0 540 440" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Gradient đĩa bánh viền vàng sang trọng -->
          <linearGradient id="plate-rim" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#d97706"/>
            <stop offset="30%" stop-color="#fbbf24"/>
            <stop offset="50%" stop-color="#fef08a"/>
            <stop offset="70%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#b45309"/>
          </linearGradient>

          <linearGradient id="plate-surface" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="60%" stop-color="#f8fafc"/>
            <stop offset="100%" stop-color="#e2e8f0"/>
          </linearGradient>

          <!-- Gradient tầng bánh dưới (Kem dâu pastel mềm mượt) -->
          <linearGradient id="bottom-tier-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f472b6"/>
            <stop offset="20%" stop-color="#fbcfe8"/>
            <stop offset="65%" stop-color="#f472b6"/>
            <stop offset="100%" stop-color="#db2777"/>
          </linearGradient>

          <!-- Gradient tầng bánh trên (Kem bơ sữa dâu tây ngọt ngào) -->
          <linearGradient id="top-tier-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#fb7185"/>
            <stop offset="25%" stop-color="#ffe4e6"/>
            <stop offset="70%" stop-color="#f43f5e"/>
            <stop offset="100%" stop-color="#e11d48"/>
          </linearGradient>

          <!-- Lớp kem phủ vani chảy (Smooth White Glaze Drip) -->
          <linearGradient id="frosting-glaze" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="60%" stop-color="#fffbeb"/>
            <stop offset="100%" stop-color="#fef3c7"/>
          </linearGradient>

          <!-- Đổ bóng tự nhiên cho bánh -->
          <filter id="cake-shadow" x="-10%" y="-10%" width="120%" height="130%">
            <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
          </filter>

          <!-- Quầng sáng ấm áp của nến -->
          <radialGradient id="candle-glow-rad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.8"/>
            <stop offset="35%" stop-color="#fbbf24" stop-opacity="0.4"/>
            <stop offset="75%" stop-color="#f97316" stop-opacity="0.12"/>
            <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
          </radialGradient>

          <!-- Ngọn lửa nến sinh nhật chuyển sắc tự nhiên -->
          <radialGradient id="flame-grad" cx="45%" cy="80%" r="75%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="22%" stop-color="#ffffff"/>
            <stop offset="55%" stop-color="#facc15"/>
            <stop offset="85%" stop-color="#f97316"/>
            <stop offset="100%" stop-color="#dc2626"/>
          </radialGradient>

          <!-- Gradient quả dâu tây -->
          <radialGradient id="strawberry-grad" cx="35%" cy="30%" r="65%">
            <stop offset="0%" stop-color="#fca5a5"/>
            <stop offset="45%" stop-color="#dc2626"/>
            <stop offset="100%" stop-color="#881337"/>
          </radialGradient>
        </defs>

        <!-- ========================================== -->
        <!-- 1. ĐĨA BÁNH VÀ BÓNG ĐỔ TRÊN BÀN TIỆC -->
        <!-- ========================================== -->
        <g id="cake-stand">
          <!-- Bóng đổ đĩa bánh -->
          <ellipse cx="270" cy="422" rx="225" ry="16" fill="#000000" opacity="0.4" filter="blur(8px)"/>
          <!-- Chân đế đĩa bánh -->
          <path d="M 215,398 L 202,418 Q 270,426 338,418 L 325,398 Z" fill="#92400e" opacity="0.85"/>
          <!-- Vành ngoài đĩa viền vàng ánh kim -->
          <ellipse cx="270" cy="396" rx="230" ry="26" fill="url(#plate-rim)"/>
          <!-- Lòng đĩa sứ trắng mịn màng -->
          <ellipse cx="270" cy="394" rx="218" ry="22" fill="url(#plate-surface)"/>
          <!-- Vệt sáng phản chiếu trên vành đĩa -->
          <path d="M 90,396 Q 270,416 450,396" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
        </g>

        <!-- ========================================== -->
        <!-- 2. TẦNG BÁNH DƯỚI (BOTTOM TIER) - TINH TẾ & GỌN GÀNG -->
        <!-- ========================================== -->
        <g id="bottom-tier" filter="url(#cake-shadow)">
          <!-- Thân bánh hình trụ liền khối tầng 1 -->
          <path d="M 85,268 L 85,365 A 185 30 0 0 0 455,365 L 455,268 Z" fill="url(#bottom-tier-grad)"/>

          <!-- Mặt phẳng trên tầng 1 -->
          <ellipse cx="270" cy="268" rx="185" ry="30" fill="#fbcfe8"/>

        <!-- ========================================== -->
        <!-- 4. QUẦNG SÁNG & DÀN NẾN SINH NHẬT -->
        <!-- ========================================== -->
        <!-- Quầng sáng ấm áp tỏa ra từ ngọn nến -->
        <g id="candles-ambient-glow">
          <ellipse cx="270" cy="90" rx="200" ry="85" fill="url(#candle-glow-rad)" id="main_candle_glow"/>
        </g>

        <!-- Nhóm chứa các cây nến được render động -->
        <g id="candles_svg_group"></g>
      </svg>

  </main>

  <!-- JavaScript Logic -->
  <script>
    // Trạng thái ứng dụng
    let candleCount = 7;
    let recipientName = "to you!";
    let customWish = "Hãy ước một điều thật đẹp và nhấp thổi nến nhé!";
    let areCandlesLit = true;
    let audioCtx = null;
    let musicSource = null;
    let musicGain = null;
    let musicEnabled = false;

    // Giai điệu bài hát "Happy Birthday to You" (Web Audio Synth)
    const birthdayMelody = [
      [392, 0.5], [392, 0.5], [440, 1], [392, 1], [523.25, 1], [493.88, 2],
      [392, 0.5], [392, 0.5], [440, 1], [392, 1], [587.33, 1], [523.25, 2],
      [392, 0.5], [392, 0.5], [783.99, 1], [659.25, 1], [523.25, 1], [493.88, 1], [440, 2],
      [698.46, 0.5], [698.46, 0.5], [659.25, 1], [523.25, 1], [587.33, 1], [523.25, 2]
    ];

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function createBirthdayMusic(ctx) {
      const sampleRate = 22050;
      const beatSeconds = 0.46;
      const duration = birthdayMelody.reduce((sum, [, beats]) => sum + beats * beatSeconds, 0) + 0.3;
      const buffer = ctx.createBuffer(1, Math.ceil(duration * sampleRate), sampleRate);
      const samples = buffer.getChannelData(0);
      let noteStart = 0;

      birthdayMelody.forEach(([frequency, beats]) => {
        const noteLength = beats * beatSeconds;
        const soundingLength = noteLength * 0.88;
        const firstSample = Math.round(noteStart * sampleRate);
        const count = Math.floor(soundingLength * sampleRate);

        for (let i = 0; i < count; i++) {
          const t = i / sampleRate;
          // Hiệu ứng hộp nhạc (Music box chime timbre)
          const envelope = Math.min(1, t / 0.02, Math.exp(-t * 2.8));
          samples[firstSample + i] = envelope * (
            Math.sin(2 * Math.PI * frequency * t) +
            0.28 * Math.sin(4 * Math.PI * frequency * t) +
            0.12 * Math.sin(6 * Math.PI * frequency * t)
          ) * 0.38;
        }
        noteStart += noteLength;
      });
      return buffer;
    }

    function toggleMusic() {
      try {
        const ctx = getAudioContext();
        if (!musicSource) {
          musicGain = ctx.createGain();
          musicGain.gain.value = 0.16;
          musicGain.connect(ctx.destination);
          musicSource = ctx.createBufferSource();
          musicSource.buffer = createBirthdayMusic(ctx);
          musicSource.loop = true;
          musicSource.connect(musicGain);
          musicSource.start();
          musicEnabled = true;
        } else {
          musicEnabled = !musicEnabled;
          musicGain.gain.setTargetAtTime(musicEnabled ? 0.16 : 0, ctx.currentTime, 0.03);
        }
      } catch (err) {
        console.warn("Audio Context:", err);
      }
    }

    // Âm thanh tiếng thổi phù (Puff sound)
    function playPuffSound() {
      try {
        const ctx = getAudioContext();
        const bufferSize = ctx.sampleRate * 0.32;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.12));
        }
        const whiteNoise = ctx.createBufferSource();
        whiteNoise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(600, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.3);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);

        whiteNoise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        whiteNoise.start();
      } catch (e) {}
    }

    // Âm thanh chuông ngân nga khi thắp sáng nến (Chime)
    function playChimeSound() {
      try {
        const ctx = getAudioContext();
        [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const t = ctx.currentTime + idx * 0.07;
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.55);
        });
      } catch (e) {}
    }

    // =========================================================
    // RENDER NẾN SINH NHẬT VÀ NGỌN LỬA TINH TẾ (KHÔNG RỐI)
    // =========================================================
    const CANDLE_PALETTE = [
      '#f43f5e', // Hồng dâu pastel
      '#38bdf8', // Xanh baby pastel
      '#fbbf24', // Vàng kem pastel
      '#c084fc', // Tím lavender
      '#34d399'  // Xanh mint pastel
    ];

    function buildCandles(count) {
      const container = document.getElementById("candles_svg_group");
      if (!container) return;
      container.innerHTML = "";

      const n = Math.max(1, Math.min(15, count));
      const startX = 195;
      const endX = 345;
      const step = n > 1 ? (endX - startX) / (n - 1) : 0;
      const candleWidth = Math.max(8, Math.min(12, 90 / n));

      for (let i = 0; i < n; i++) {
        const cx = n === 1 ? 270 : startX + i * step;
        const norm = (cx - 270) / 80;
        const cy = 162 + (norm * norm) * 8;
        const color = CANDLE_PALETTE[i % CANDLE_PALETTE.length];
        const candleHeight = 48;

        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", "candle-item");
        g.setAttribute("data-index", i);

        // 1. Thân nến trơn bóng pastel cao cấp
        const candleX = cx - candleWidth / 2;
        const candleY = cy - candleHeight;
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", candleX);
        rect.setAttribute("y", candleY);
        rect.setAttribute("width", candleWidth);
        rect.setAttribute("height", candleHeight);
        rect.setAttribute("rx", candleWidth / 3.5);
        rect.setAttribute("fill", color);
        rect.setAttribute("stroke", "rgba(0,0,0,0.12)");
        rect.setAttribute("stroke-width", "0.8");
        g.appendChild(rect);

        // Vệt sáng highlight thanh lịch dọc thân nến
        const highlight = document.createElementNS("http://www.w3.org/2000/svg", "line");
        highlight.setAttribute("x1", candleX + 2.5);
        highlight.setAttribute("y1", candleY + 3);
        highlight.setAttribute("x2", candleX + 2.5);
        highlight.setAttribute("y2", candleY + candleHeight - 3);
        highlight.setAttribute("stroke", "rgba(255, 255, 255, 0.6)");
        highlight.setAttribute("stroke-width", "1.6");
        highlight.setAttribute("stroke-linecap", "round");
        g.appendChild(highlight);

        // 2. Bấc nến màu than
        const wick = document.createElementNS("http://www.w3.org/2000/svg", "line");
        wick.setAttribute("x1", cx);
        wick.setAttribute("y1", candleY);
        wick.setAttribute("x2", cx);
        wick.setAttribute("y2", candleY - 8);
        wick.setAttribute("stroke", "#1f2937");
        wick.setAttribute("stroke-width", "1.8");
        wick.setAttribute("stroke-linecap", "round");
        g.appendChild(wick);

        // 3. Ngọn lửa nến ấm áp lung linh
        const flameWrapper = document.createElementNS("http://www.w3.org/2000/svg", "g");
        flameWrapper.setAttribute("class", "flame-wrapper");
        flameWrapper.setAttribute("id", `flame-wrap-${i}`);
        flameWrapper.setAttribute("transform", `translate(${cx}, ${candleY - 7})`);

        const flameG = document.createElementNS("http://www.w3.org/2000/svg", "g");
        flameG.setAttribute("class", "flame-element");
        flameG.setAttribute("id", `flame-${i}`);
        flameG.style.transformOrigin = "0px 0px";

        // Vỏ ngoài ngọn lửa màu vàng ấm
        const flamePath = document.createElementNS("http://www.w3.org/2000/svg", "path");
        flamePath.setAttribute("d", "M 0,-24 C 8,-16 9,-2 0,0 C -9,-2 -8,-16 0,-24 Z");
        flamePath.setAttribute("fill", "url(#flame-grad)");
        flameG.appendChild(flamePath);

        // Lõi sáng trắng trong lòng ngọn lửa
        const innerFlame = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
        innerFlame.setAttribute("cx", "0");
        innerFlame.setAttribute("cy", "-7");
        innerFlame.setAttribute("rx", "2.8");
        innerFlame.setAttribute("ry", "6.5");
        innerFlame.setAttribute("fill", "#ffffff");
        innerFlame.setAttribute("opacity", "0.9");
        flameG.appendChild(innerFlame);

        flameWrapper.appendChild(flameG);
        g.appendChild(flameWrapper);

        // 4. Khói bốc lên khi nến tắt (Smoke puff)
        const smoke = document.createElementNS("http://www.w3.org/2000/svg", "path");
        smoke.setAttribute("class", "smoke-puff");
        smoke.setAttribute("id", `smoke-${i}`);
        smoke.setAttribute("d", `M ${cx},${candleY - 10} Q ${cx - 6},${candleY - 26} ${cx + 4},${candleY - 40} Q ${cx - 4},${candleY - 55} ${cx + 2},${candleY - 70}`);
        smoke.setAttribute("fill", "none");
        smoke.setAttribute("stroke", "rgba(255, 255, 255, 0.7)");
        smoke.setAttribute("stroke-width", "3.2");
        smoke.setAttribute("stroke-linecap", "round");
        g.appendChild(smoke);

        container.appendChild(g);
      }

      areCandlesLit = true;
    }

    // =========================================================
    // HÀNH ĐỘNG THỔI NẾN VÀ THẮP NẾN (TỰ ĐỘNG TUNG HOA KHI TẮT)
    // =========================================================
    function blowOutCandles() {
      if (!areCandlesLit) return;
      areCandlesLit = false;

      playPuffSound();

      // Tắt các ngọn lửa & kích hoạt làn khói
      const flames = document.querySelectorAll(".flame-element");
      flames.forEach(f => {
        f.style.opacity = "0";
        f.style.transform = "scale(0)";
      });

      const smokes = document.querySelectorAll(".smoke-puff");
      smokes.forEach(s => {
        s.classList.remove("blown");
        void s.offsetWidth; // trigger reflow
        s.classList.add("blown");
      });

      // Làm mờ quầng sáng của nến
      const glow = document.getElementById("main_candle_glow");
      if (glow) glow.style.opacity = "0.08";

      // TỰ ĐỘNG TUNG HOA CONFETTI RỰC RỠ!
      fireConfetti(true);

      // Cập nhật thông điệp ước nguyện
      const msgElem = document.getElementById("message_text");
      if (msgElem) {
        msgElem.innerHTML = "🌟 <strong>Mọi điều ước của bạn sẽ thành hiện thực!</strong> 🎂";
      }
    }

    function relightCandles() {
      if (areCandlesLit) return;
      areCandlesLit = true;

      playChimeSound();

      const flames = document.querySelectorAll(".flame-element");
      flames.forEach((f, idx) => {
        setTimeout(() => {
          f.style.opacity = "1";
          f.style.transform = "scale(1)";
        }, idx * 60);
      });

      const smokes = document.querySelectorAll(".smoke-puff");
      smokes.forEach(s => s.classList.remove("blown"));

      const glow = document.getElementById("main_candle_glow");
      if (glow) glow.style.opacity = "1";

      const msgElem = document.getElementById("message_text");
      if (msgElem) {
        msgElem.textContent = customWish;
      }
    }

    // =========================================================
    // HỆ THỐNG PHÁO GIẤY CONFETTI NGHỆ THUẬT
    // =========================================================
    const confettiCanvas = document.getElementById("confetti-canvas");
    const confettiCtx = confettiCanvas.getContext("2d");
    let confettiParticles = [];
    let confettiAnimationId = null;

    function resizeConfetti() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeConfetti);
    resizeConfetti();

    const CONFETTI_COLORS = ["#f43f5e", "#fbbf24", "#38bdf8", "#4ade80", "#c084fc", "#fb923c", "#f472b6", "#ffffff"];

    function fireConfetti(isGrand = false) {
      const count = isGrand ? 160 : 70;
      const originX = confettiCanvas.width / 2;
      const originY = confettiCanvas.height * 0.65;

      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 14 + 6;
        confettiParticles.push({
          x: originX,
          y: originY,
          vx: Math.cos(angle) * velocity,
          vy: Math.sin(angle) * velocity - (Math.random() * 8 + 4),
          size: Math.random() * 8 + 5,
          color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 12,
          opacity: 1,
          gravity: 0.38,
          drag: 0.95
        });
      }

      if (!confettiAnimationId) {
        animateConfetti();
      }
    }

    function animateConfetti() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

      for (let i = confettiParticles.length - 1; i >= 0; i--) {
        const p = confettiParticles[i];
        p.vx *= p.drag;
        p.vy = p.vy * p.drag + p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.rotationSpeed;
        p.opacity -= 0.007;

        if (p.opacity <= 0 || p.y > confettiCanvas.height + 20) {
          confettiParticles.splice(i, 1);
          continue;
        }

        confettiCtx.save();
        confettiCtx.translate(p.x, p.y);
        confettiCtx.rotate((p.rotation * Math.PI) / 180);
        confettiCtx.globalAlpha = p.opacity;
        confettiCtx.fillStyle = p.color;
        confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
        confettiCtx.restore();
      }

      if (confettiParticles.length > 0) {
        confettiAnimationId = requestAnimationFrame(animateConfetti);
      } else {
        confettiAnimationId = null;
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
    }

    // =========================================================
    // ĐỐM SÁNG BOKEH VÀ TIỆC LUNG LINH
    // =========================================================
    function createBokehLights() {
      const wrap = document.getElementById("bokeh-container");
      if (!wrap) return;
      const colors = ["#fbbf24", "#f43f5e", "#a855f7", "#38bdf8", "#fed7aa"];

      for (let i = 0; i < 22; i++) {
        const orb = document.createElement("div");
        orb.className = "bokeh";
        const size = Math.random() * 60 + 25;
        orb.style.width = `${size}px`;
        orb.style.height = `${size}px`;
        orb.style.left = `${Math.random() * 100}%`;
        orb.style.top = `${Math.random() * 90}%`;
        orb.style.background = colors[Math.floor(Math.random() * colors.length)];
        orb.style.animationDuration = `${Math.random() * 8 + 8}s`;
        orb.style.animationDelay = `${Math.random() * 5}s`;
        wrap.appendChild(orb);
      }
    }

    // =========================================================
    // KHỞI TẠO VÀ XỬ LÝ SỰ KIỆN TƯƠNG TÁC
    // =========================================================
    function init() {
      createBokehLights();

      // Đọc URL parameters: ?name=...&candles=...&message=...
      const url = new URL(window.location.href);
      const nameParam = url.searchParams.get("name");
      const candlesParam = parseInt(url.searchParams.get("candles"));
      const messageParams = url.searchParams.getAll("message");

      if (nameParam && nameParam.trim() !== "") {
        recipientName = nameParam.trim();
        document.getElementById("main_title_text").textContent = `Happy Birthday ${recipientName}!`;
      }

      if (!isNaN(candlesParam) && candlesParam > 0) {
        candleCount = Math.min(15, candlesParam);
      }

      if (messageParams && messageParams.length > 0) {
        customWish = messageParams.join(" • ");
        document.getElementById("message_text").textContent = customWish;
      }

      // Xây dựng dàn nến tinh gọn
      buildCandles(candleCount);

      // Tương tác trực tiếp trên Bánh sinh nhật
      const cakeArea = document.getElementById("cake_click_area");

      cakeArea.addEventListener("click", () => {
        // Tự động bật nhạc sinh nhật nếu chưa bật
        if (!musicSource) toggleMusic();

        // Nhấp vào bánh: nếu nến đang sáng -> thổi nến & tự động tung hoa; nếu đã tắt -> thắp nến lại
        if (areCandlesLit) {
          blowOutCandles();
        } else {
          relightCandles();
        }
      });

      // Tự động khởi tạo AudioContext khi có tương tác đầu tiên
      window.addEventListener("pointerdown", () => {
        if (!musicSource) toggleMusic();
      }, { once: true });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
