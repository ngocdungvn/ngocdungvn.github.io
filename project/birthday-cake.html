    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            outline: none;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(135deg, #f43f5e 0%, #fb7185 50%, #fda4af 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
        }



        /* Responsive Scene Container */
        .scene-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
        }

        .cake-scene {
            position: absolute;
            top: 48%;
            left: 50%;
            width: 600px;
            height: 600px;
            transform: translate(-50%, -50%);
            transform-origin: center center;
            pointer-events: auto;
        }

        .cake {
            position: absolute;
            width: 600px;
            height: 500px;
            top: 50%;
            left: 50%;
            margin-top: -250px;
            margin-left: -300px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .cake > * {
            position: relative;
        }

        .layer, .icing {
            display: block;
            width: 100%;
            border-bottom-left-radius: 50%;
            border-bottom-right-radius: 50%;
            border: solid 1px #000000;
        }

        .layer {
            margin-top: -100px;
            height: 200px;
            background: #553c13;
            z-index: 0;
        }

        .bottom { z-index: 1; }
        .middle { z-index: 2; }
        .top { z-index: 3; }

        .top, .icing {
            border-top-left-radius: 25%;
            border-top-right-radius: 25%;
        }

        .icing {
            margin-top: 0px;
            height: 100px;
            background: #f0e4d0;
            z-index: 4;
        }

        .drip {
            border-bottom-left-radius: 50%;
            border-bottom-right-radius: 50%;
            background-color: #f0e4d0;
            border-bottom: solid 1px #000000;
            z-index: 5;
        }

        .drip:nth-child(1) {
            width: 40px;
            height: 50px;
            margin-top: 35px;
            margin-left: -1px;
            border-left: solid 1px #000000;
            border-right: solid 1px #000000;
            transform: skewY(20deg);
        }

        .drip:nth-child(2) {
            width: 175px;
            height: 100px;
            margin-top: -60px;
            margin-left: 40px;
        }

        .drip:nth-child(3) {
            width: 200px;
            height: 100px;
            margin-top: -60px;
            margin-left: 200px;
        }

        .drip:nth-child(4) {
            width: 175px;
            height: 100px;
            margin-top: -130px;
            margin-left: 395px;
        }

        .drip:nth-child(5) {
            width: 40px;
            height: 50px;
            margin-top: -90px;
            margin-left: 559px;
            border-left: solid 1px #000000;
            border-right: solid 1px #000000;
            transform: skewY(-20deg);
        }

        .candle {
            position: absolute;
            width: 18px;
            height: 100px;
            top: 50%;
            left: 50%;
            margin-top: -325px;
            margin-left: -10px;
            background: #ffffff;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            z-index: 10;
            cursor: pointer;
            touch-action: manipulation;
        }

        .candle:after, .candle:before {
            background: rgba(255, 0, 0, 0.4);
            content: "";
            position: absolute;
            width: 100%;
            height: 3px;
            border-radius: 100%;
            transform: skewY(-50deg);
        }

        .candle:after {
            top: 25%;
            left: 0;
        }

        .candle:before {
            top: 50%;
            left: 0;
        }

        .flame {
            border-radius: 100%;
            position: relative;
            width: 7px;
            height: 18px;
            top: 0px;
            left: 50%;
            margin-left: -3.2px;
            margin-top: -18px;
            pointer-events: none;
        }

        .flame:nth-child(1) { animation: flame 2s 0s infinite; }
        .flame:nth-child(2) { animation: flame 1.5s 0s infinite; }
        .flame:nth-child(3) { animation: flame 1s 0s infinite; }
        .flame:nth-child(4) { animation: flame 0.5s 0s infinite; }
        .flame:nth-child(5) { animation: flame 0.25s 0s infinite; }

        @keyframes flame {
            0%, 100% {
                background: rgba(254, 248, 97, 0.6);
                box-shadow: 0 0 35px 10px rgba(248, 233, 209, 0.3);
                transform: translateY(0) scale(1);
            }
            50% {
                background: rgba(255, 50, 0, 0.2);
                box-shadow: 0 0 40px 20px rgba(248, 233, 209, 0.3);
                transform: translateY(-20px) scale(0);
            }
        }

        .message {
            position: absolute;
            width: 600px;
            top: 50%;
            left: 50%;
            margin-top: 250px;
            margin-left: -300px;
            text-align: center;
            font-family: 'Leckerli One', cursive;
            font-size: 38px;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }

    </style>
</head>
<body onload="init();">
    <div class="scene-container">
        <div class="cake-scene">
            <div class="cake" title="Click chuột trái để thổi nến | Double-click để thắp lại nến">
                <div class="icing">
                    <div class="drip"></div>
                    <div class="drip"></div>
                    <div class="drip"></div>
                    <div class="drip"></div>
                    <div class="drip"></div>
                </div>
                <div class="layer top"></div>
                <div class="layer middle"></div>
                <div class="layer bottom"></div>
            </div>
            <div id="candles_container"></div>
            <div id="message_container" class="message"></div>
        </div>
    </div>

    <script>
        let currentCandleCount = 9;
        let audioCtx = null;
        let clickTimeout = null;
        let lastTapTime = 0;

        function handleSceneClick(e) {
            if (e.button !== undefined && e.button !== 0) return;
            if (clickTimeout) {
                clearTimeout(clickTimeout);
                clickTimeout = null;
            }
            clickTimeout = setTimeout(() => {
                putOutCandles();
                clickTimeout = null;
            }, 250);
        }

        function handleSceneDblClick(e) {
            if (e.button !== undefined && e.button !== 0) return;
            if (clickTimeout) {
                clearTimeout(clickTimeout);
                clickTimeout = null;
            }
            relightCandles();
        }

        function handleTouchEnd(e) {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTapTime;
            if (tapLength > 0 && tapLength < 300) {
                if (clickTimeout) {
                    clearTimeout(clickTimeout);
                    clickTimeout = null;
                }
                relightCandles();
                if (e.cancelable) e.preventDefault();
            }
            lastTapTime = currentTime;
        }

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playPuffSound() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.25);
            } catch(e) {}
        }

        function playChimeSound() {
            try {
                const ctx = getAudioContext();
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    const t = ctx.currentTime + idx * 0.08;
                    gain.gain.setValueAtTime(0.08, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(t);
                    osc.stop(t + 0.4);
                });
            } catch(e) {}
        }

        function updateScale() {
            const scene = document.querySelector('.cake-scene');
            if (!scene) return;
            const availableWidth = window.innerWidth - 32;
            const scale = Math.min(1, Math.max(0.35, availableWidth / 600));
            scene.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }

        function init() {
            updateScale();
            window.addEventListener('resize', updateScale);

            window.addEventListener('click', handleSceneClick);
            window.addEventListener('dblclick', handleSceneDblClick);
            window.addEventListener('touchend', handleTouchEnd, { passive: false });

            var url = new URL(window.location.href);

            var count = parseInt(url.searchParams.get("candles"));
            if (!isNaN(count) && count > 0) {
                currentCandleCount = Math.min(count, 20);
            }

            buildCandles(currentCandleCount);
            appendName(url.searchParams.get("name"));
            appendMessages(url.searchParams.getAll("message"));
        }

        function appendMessages(messages) {
            if (!Array.isArray(messages) || messages.length == 0) return;
            let messageBox = document.getElementById("message_container");
            if (messageBox) {
                messageBox.innerHTML = `${messages.join("<br />")}`;
            }
        }

        function appendName(message) {
            let messageBox = document.getElementById("message_container");
            if (messageBox) {
                messageBox.innerHTML = `Happy Birthday ${message != null ? message : "to you!"}`;
            }
        }

        function buildCandles(candlesCount) {
            let container = document.getElementById("candles_container");
            if (!container) return;
            container.innerHTML = "";

            let candleHalfCount = 1;
            for (var i = 0; i < candlesCount; i++) {
                if ((i + 1) < (candlesCount / 2)) candleHalfCount++;
                else if ((i + 1) > (candlesCount / 2)) candleHalfCount--;

                let candleXPositionOffset = candleHalfCount * (20 / (candlesCount / 2));
                let candleXPosition = ((-310 + (600 / candlesCount) / 2) + ((600 / candlesCount) * i));
                let candleYPosition = -1 * Math.floor(Math.random() * ((325 + candleXPositionOffset) - (320 - candleXPositionOffset) + 1) + (320 - candleXPositionOffset));

                const candleEl = document.createElement("div");
                candleEl.id = `candle_${i}`;
                candleEl.className = "candle";
                candleEl.style.marginLeft = `${candleXPosition}px`;
                candleEl.style.marginTop = `${candleYPosition}px`;

                for (var j = 0; j < 5; j++) {
                    const flameEl = document.createElement("div");
                    flameEl.className = "flame";
                    candleEl.appendChild(flameEl);
                }

                container.appendChild(candleEl);
            }
        }

        function putOutCandle(candle) {
            if (!candle) return;
            const flames = candle.querySelectorAll(".flame");
            if (flames.length > 0) {
                playPuffSound();
                flames.forEach(f => f.remove());
            }
        }

        function putOutCandles() {
            let candles = document.getElementsByClassName("candle");
            let hadFlame = false;
            for (var i = 0; i < candles.length; i++) {
                const flames = candles[i].querySelectorAll(".flame");
                if (flames.length > 0) {
                    hadFlame = true;
                    flames.forEach(f => f.remove());
                }
            }
            if (hadFlame) playPuffSound();
        }

        function relightCandles() {
            playChimeSound();
            buildCandles(currentCandleCount);
        }
    </script>
</body>
