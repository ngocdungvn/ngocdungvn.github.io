  <style type="text/css" media="screen">
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html {
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    body {
      margin: 0;
      height: 100%;
      width: 100%;
      background: radial-gradient(circle at 50% 30%, #e0f2fe 0%, #bae6fd 60%, #7dd3fc 100%);
      touch-action: none;
      font-family: 'Outfit', sans-serif;
      transition: background 0.5s ease;
      position: relative;
    }

    /* Chế độ ban đêm cho phòng bé ngủ */
    body.dark-mode {
      background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0f172a 70%, #020617 100%);
    }

    /*******************
     * NHÂN VẬT BÉ YÊU *
     *******************/
    #Mfish, .Mbaby {
      position: absolute;
      top: 45%;
      left: 45%;
      width: 90px;
      height: auto;
      pointer-events: none;
      z-index: 50;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.18));
      transition: transform 0.12s ease-out;
      transform-origin: center center;
      will-change: transform, left, top;
    }

    /* Hiệu ứng hào quang quanh bé khi ăn */
    .baby-chew {
      animation: babyBounce 0.25s ease-out;
    }

    @keyframes babyBounce {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /*****************************
     * CÁC MÓN HOA QUẢ & THỨC ĂN *
     *****************************/
    .food-item {
      position: absolute;
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      cursor: pointer;
      z-index: 20;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.12));
      transition: left 2.6s ease-out, top 2.6s ease-out, transform 0.3s ease;
      will-change: left, top, transform;
    }

    .food-item svg {
      width: 100%;
      height: 100%;
      display: block;
      animation: foodWobble 3s infinite ease-in-out alternate;
    }

    @keyframes foodWobble {
      0% { transform: translateY(0px) rotate(-4deg); }
      50% { transform: translateY(-6px) rotate(4deg); }
      100% { transform: translateY(0px) rotate(-3deg); }
    }

    /* Hiệu ứng khi bị bé ăn biến mất */
    .food-eaten {
      transform: scale(0) rotate(45deg) !important;
      opacity: 0;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease !important;
    }

    /* Bong bóng popup khi ăn được */
    .yum-popup {
      position: absolute;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 15px;
      color: #ea580c;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #fdba74;
      padding: 3px 10px;
      border-radius: 9999px;
      pointer-events: none;
      z-index: 60;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.25);
      animation: floatUpFade 0.75s ease-out forwards;
    }

    @keyframes floatUpFade {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.6);
      }
      50% {
        transform: translate(-50%, -90px) scale(1.15);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -120px) scale(1);
      }
    }

    /*****************************
     * GIAO DIỆN ĐIỀU KHIỂN (UI) *
     *****************************/
    /* Coordinate box ẩn/hiện khi có hash #xy */
    #coord {
      position: absolute;
      left: 14px;
      bottom: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #475569;
      background: rgba(255, 255, 255, 0.65);
      padding: 4px 8px;
      border-radius: 6px;
      pointer-events: none;
      z-index: 90;
    }

    body.dark-mode #coord {
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.7);
    }

    /* Bảng đếm số món ăn đã ăn */
    #eaten {
      position: absolute;
      text-align: center;
      left: 50%;
      transform: translateX(-50%);
      top: 16px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #0369a1;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 22px;
      border-radius: 9999px;
      box-shadow: 0 4px 16px rgba(3, 105, 161, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.8);
      z-index: 99;
      pointer-events: none;
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    body.dark-mode #eaten {
      color: #38bdf8;
      background: rgba(30, 41, 59, 0.85);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    /* Nút Thêm Thức Ăn */
    #FishIt {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 20px;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      border-radius: 9999px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      box-shadow: 0 6px 20px rgba(234, 88, 12, 0.38), 0 0 0 2px rgba(255, 255, 255, 0.4);
      cursor: pointer;
      touch-action: manipulation;
      z-index: 100;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #FishIt:hover {
      transform: translateX(-50%) translateY(-2px);
      box-shadow: 0 8px 24px rgba(234, 88, 12, 0.48);
    }

    #FishIt:active {
      transform: translateX(-50%) scale(0.95);
    }

    /* Bảng Toggle chế độ */
    #darkToggle {
      position: absolute;
      right: 16px;
      top: 16px;
      left: auto;
      text-align: left;
      font-family: 'Outfit', sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      color: #334155;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 14px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.6);
      z-index: 100;
      line-height: 1.8;
      transition: all 0.3s ease;
    }

    body.dark-mode #darkToggle {
      color: #e2e8f0;
      background: rgba(30, 41, 59, 0.85);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    #darkToggle label {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    #darkToggle input {
      accent-color: #f97316;
      cursor: pointer;
      width: 15px;
      height: 15px;
      margin: 0;
    }

    /* Nút quay về trang chủ */
    #homeBtn {
      position: absolute;
      left: 16px;
      top: 16px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #0369a1;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.6);
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    body.dark-mode #homeBtn {
      color: #38bdf8;
      background: rgba(30, 41, 59, 0.85);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    #homeBtn:hover {
      transform: translateY(-2px);
      background: #ffffff;
    }

    /* Template kho thức ăn ẩn */
    #food_templates {
      display: none;
    }

    @media (max-width: 600px) {
      #Mfish, .Mbaby {
        width: 72px;
      }
      .food-item {
        width: 38px !important;
        height: 38px !important;
      }
      #eaten {
        font-size: 13px;
        padding: 6px 16px;
        top: 66px;
      }
      #FishIt {
        font-size: 13.5px;
        padding: 10px 22px;
        bottom: 16px;
      }
      #darkToggle {
        font-size: 11.5px;
        padding: 6px 10px;
        top: 12px;
        right: 12px;
      }
      #homeBtn {
        font-size: 12px;
        padding: 6px 10px;
        top: 12px;
        left: 12px;
      }
    }
  </style>

        <line x1="26" y1="38" x2="38" y2="36" stroke="#C2410C" stroke-width="2" stroke-linecap="round"/>
        <line x1="28" y1="48" x2="34" y2="47" stroke="#C2410C" stroke-width="2" stroke-linecap="round"/>
        <path d="M31 20C28 10 22 6 18 6C22 12 28 16 31 20Z" fill="#22C55E"/>
        <path d="M33 20C36 10 42 6 46 6C42 12 36 16 33 20Z" fill="#16A34A"/>
        <path d="M32 20V4" stroke="#15803D" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- 14. Lát Bánh Kem Gato 🍰 -->
    <div data-name="Bánh kem" data-type="cake">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M12 42L32 16L54 36L44 52L12 42Z" fill="#FED7AA"/>
        <path d="M12 42L32 16L54 36H12V42Z" fill="#FFFFFF"/>
        <path d="M12 42V52L44 56V52L12 42Z" fill="#FB923C"/>
        <circle cx="32" cy="14" r="5" fill="#EF4444"/>
        <path d="M32 14C33 10 36 9 37 8" stroke="#16A34A" stroke-width="1.5"/>
      </svg>
    </div>
  </div>

  <div id="coord"></div>
  <div id="eaten">🍼 Bé đã măm măm: 0 món ngon</div>

  <div id="darkToggle">
    <label for="toggleBox0">
      <input id="toggleBox0" type="checkbox" onchange="toggleDarkMode(this)">
      🌙 Chế độ ban đêm
    </label><br>
    <label for="toggleBox1">
      <input id="toggleBox1" type="checkbox" onchange="toggleAutoSpawn(this)">
      🍩 Mưa đồ ăn liên tục
    </label>
  </div>

  <button id="FishIt" onclick="spawnMoreFood();">
    <span>🍓 Thêm Thức Ăn</span>
  </button>

  <script type="text/javascript">
    // Các biến trạng thái chính
    var fX = -38;               // Độ lệch tâm X của bé (căn giữa ngón tay/chuột)
    var fY = -38;               // Độ lệch tâm Y của bé
    var xFLIP = 1;              // Hướng quay mặt của bé (1: nhìn sang phải, -1: nhìn sang trái)
    var growthFactor = 0.22;    // Tốc độ lớn lên của bé mỗi khi ăn
    var o_food_count = 0;       // Đếm số lượng món ăn đã sinh ra
    var o_food_list = [];       // Danh sách element thức ăn đang có trên màn hình
    var eaten = 0;              // Số lượng món ăn bé đã măm măm
    var mSpeed = 0.08;          // Tốc độ phản hồi của bé khi di chuyển chuột (giây)

    // Âm thanh Web Audio API (nhẹ nhàng, không cần tải file ngoài)
    var audioCtx = null;
    function playYumSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'sine';
        var now = audioCtx.currentTime;
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      } catch (err) {
        // Fallback an toàn nếu trình duyệt chặn autoplay audio
      }
    }

    // Kích thước cửa sổ
    var width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
    var height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;

    window.addEventListener('resize', function() {
      width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
      height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
    });

    // Xóa món ăn khỏi mảng theo dõi
    function removeFoodItem(item) {
      var index = o_food_list.indexOf(item);
      if (index > -1) {
        o_food_list.splice(index, 1);
      }
    }

    // Xóa khỏi DOM
    function removeElement(element) {
      if (element && element.parentNode) {
        element.parentNode.removeChild(element);
      }
    }

    // Tạo popup chữ "Yum! 🍓" nổi lên khi ăn
    function showYumPopup(x, y, foodName) {
      var popup = document.createElement("div");
      popup.className = "yum-popup";
      var icons = ["🍓", "🍼", "🍎", "🍌", "🍉", "🍪", "🍩", "🧁", "🍦", "✨"];
      var randomIcon = icons[Math.floor(Math.random() * icons.length)];
      popup.innerHTML = "+1 " + (foodName || "Ngon quá") + " " + randomIcon;
      popup.style.left = x + "px";
      popup.style.top = y + "px";
      document.body.appendChild(popup);
      setTimeout(function() {
        removeElement(popup);
      }, 750);
    }

    // Hàm kiểm tra va chạm giữa bé và các món ăn
    function babyEatingCheck() {
      var babyEl = document.getElementById('Mfish');
      if (!babyEl) return;
      var babyRect = babyEl.getBoundingClientRect();

      var padding = 10;
      var bLeft = babyRect.left + padding;
      var bRight = babyRect.right - padding;
      var bTop = babyRect.top + padding;
      var bBottom = babyRect.bottom - padding;

      for (var i = o_food_list.length - 1; i >= 0; i--) {
        var food = o_food_list[i];
        if (!food || food.dataset.eaten === "true") continue;

        var fRect = food.getBoundingClientRect();
        var overlap = !(bRight < fRect.left ||
                        bLeft > fRect.right ||
                        bBottom < fRect.top ||
                        bTop > fRect.bottom);

        if (overlap) {
          food.dataset.eaten = "true";
          food.classList.add("food-eaten");
          var foodName = food.dataset.name || "Món ngon";
          var targetX = fRect.left + fRect.width / 2;
          var targetY = fRect.top + fRect.height / 2;

          // Hiệu ứng ăn
          showYumPopup(targetX, targetY, foodName);
          playYumSound();

          // Kích hoạt animation rung nảy bé
          babyEl.classList.remove("baby-chew");
          void babyEl.offsetWidth; // trigger reflow
          babyEl.classList.add("baby-chew");

          // Xóa sau khi animation hoàn tất
          (function(fElement) {
            setTimeout(function() {
              removeFoodItem(fElement);
              removeElement(fElement);
            }, 250);
          })(food);

          eaten++;

          // Cập nhật bảng đếm số món
          var eatenEl = document.getElementById("eaten");
          if (eaten <= 1) {
            eatenEl.innerHTML = "🍼 Bé đã măm măm: <b>" + eaten + "</b> món ngon!";
          } else {
            eatenEl.innerHTML = "🎉 Bé đã măm măm: <b>" + eaten + "</b> món ngon!";
          }

          // Cập nhật kích thước bé lớn dần (scale)
          var growth = 1 + (growthFactor * Math.log10(eaten + 1));
          babyEl.style.transform = "scaleX(" + xFLIP + ") scale(" + growth + ")";
        }
      }
    }

    // Kiểm tra va chạm thường xuyên mỗi 50ms cho cảm giác mượt mà
    setInterval(babyEatingCheck, 50);

    // Xử lý di chuyển chuột và cảm ứng cho bé bò theo
    (function() {
      var oldCoordX = window.innerWidth / 2;

      document.onmousemove = handlePointerMove;

      document.addEventListener('touchstart', function(e) {
        if (e.target.closest && (e.target.closest('#darkToggle') || e.target.closest('#FishIt') || e.target.closest('#homeBtn'))) return;
        if (e.touches && e.touches[0]) handlePointerMove(e.touches[0]);
      }, { passive: true });

      document.addEventListener('touchmove', function(e) {
        if (e.target.closest && (e.target.closest('#darkToggle') || e.target.closest('#FishIt') || e.target.closest('#homeBtn'))) return;
        if (e.touches && e.touches[0]) handlePointerMove(e.touches[0]);
      }, { passive: true });

      function handlePointerMove(event) {
        var pageX = event.pageX;
        var pageY = event.pageY;

        if (pageX == null && event.clientX != null) {
          var doc = document.documentElement;
          var body = document.body;
          pageX = event.clientX + (doc && doc.scrollLeft || body && body.scrollLeft || 0) - (doc && doc.clientLeft || body && body.clientLeft || 0);
          pageY = event.clientY + (doc && doc.scrollTop || body && body.scrollTop || 0) - (doc && doc.clientTop || body && body.clientTop || 0);
        }

        var baby = document.getElementById('Mfish');
        if (!baby) return;

        baby.style.left = (pageX + fX) + 'px';
        baby.style.top = (pageY + fY) + 'px';

        // Hiển thị tọa độ nếu trên url có #xy
        if (location.hash.substr(1) === "xy") {
          var text = "X: " + Math.round(pageX) + ", Y: " + Math.round(pageY) + " | Món ăn: " + o_food_list.length;
          document.getElementById("coord").innerHTML = text;
        } else {
          document.getElementById("coord").innerHTML = "";
        }

        // Hướng quay mặt của bé:
        // baby.png gốc nhìn sang PHẢI (right).
        // Nếu chuột đi sang PHẢI (pageX > oldCoordX): xFLIP = 1 (mặt hướng phải).
        // Nếu chuột đi sang TRÁI (pageX < oldCoordX): xFLIP = -1 (mặt lật sang trái).
        if (pageX > oldCoordX + 2) {
          xFLIP = 1;
        } else if (pageX < oldCoordX - 2) {
          xFLIP = -1;
        }
        oldCoordX = pageX;

        var growth = 1;
        if (eaten > 0) {
          growth = 1 + (growthFactor * Math.log10(eaten + 1));
        }
        baby.style.transform = "scaleX(" + xFLIP + ") scale(" + growth + ")";
      }
    })();

    // Lấy ngẫu nhiên template thức ăn từ kho SVG
    var foodTemplates = document.querySelectorAll("#food_templates > div");

    function createFoodElement() {
      if (!foodTemplates || foodTemplates.length === 0) return null;
      var randIndex = Math.floor(Math.random() * foodTemplates.length);
      var template = foodTemplates[randIndex];

      var foodDiv = document.createElement("div");
      foodDiv.className = "food-item";
      foodDiv.id = "food-" + o_food_count;
      foodDiv.dataset.name = template.getAttribute("data-name") || "Món ngon";
      foodDiv.dataset.type = template.getAttribute("data-type") || "fruit";
      foodDiv.innerHTML = template.innerHTML;

      // Kích thước đồ ăn tươi tắn, to rõ (42px - 54px)
      var randomSize = Math.floor(Math.random() * 13) + 42;
      foodDiv.style.width = randomSize + "px";
      foodDiv.style.height = randomSize + "px";

      o_food_count++;
      return foodDiv;
    }

    // Sinh 1 món ăn mới bay bổng trên màn hình
    function spawnFoodItem() {
      var food = createFoodElement();
      if (!food) return;

      function randW() {
        var min = 40;
        var max = Math.max(min, width - 80);
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function randH() {
        var min = 50;
        var max = Math.max(min, height - 90);
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      var startX = randW();
      var startY = randH();
      food.style.left = startX + "px";
      food.style.top = startY + "px";

      document.body.appendChild(food);
      o_food_list.push(food);

      function moveFood() {
        if (food.dataset.eaten === "true") return;
        var nextX = randW();
        var nextY = randH();
        food.style.left = nextX + "px";
        food.style.top = nextY + "px";

        var randomDuration = (Math.random() * 1.6 + 2.2).toFixed(1);
        food.style.transition = "left " + randomDuration + "s ease-in-out, top " + randomDuration + "s ease-in-out";

        setTimeout(moveFood, Math.floor(randomDuration * 1000) - 200);
      }

      setTimeout(moveFood, 300);
    }

    // Hàm gọi khi bấm nút "Thêm Thức Ăn"
    function spawnMoreFood() {
      var batch = Math.floor(Math.random() * 3) + 3;
      for (var i = 0; i < batch; i++) {
        setTimeout(spawnFoodItem, i * 120);
      }
    }

    // Tự động spawn ban đầu khi mở trang
    window.addEventListener("DOMContentLoaded", function() {
      for (var i = 0; i < 12; i++) {
        setTimeout(spawnFoodItem, i * 150);
      }
    });

    // Dark mode
    function toggleDarkMode(_this) {
      if (_this.checked) {
        document.body.classList.add("dark-mode");
      } else {
        document.body.classList.remove("dark-mode");
      }
    }

    // Auto spawn liên tục
    var autoSpawnTimer = null;
    function toggleAutoSpawn(_this) {
      if (_this.checked) {
        autoSpawnTimer = setInterval(function() {
          if (o_food_list.length < 50) {
            spawnFoodItem();
          }
        }, 900);
      } else {
        if (autoSpawnTimer) {
          clearInterval(autoSpawnTimer);
          autoSpawnTimer = null;
        }
      }
    }
  </script>
</body>
