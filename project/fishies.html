  <style type="text/css" media="screen">
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html {
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    body {
      margin: 0;
      height: 100%;
      width: 100%;
      background: radial-gradient(circle at 50% 30%, #e0f2fe 0%, #bae6fd 60%, #7dd3fc 100%);
      touch-action: none;
      font-family: 'Outfit', sans-serif;
      transition: background 0.5s ease;
      position: relative;
    }

    /* Chế độ ban đêm cho phòng bé ngủ */
    body.dark-mode {
      background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0f172a 70%, #020617 100%);
    }

    /*******************
     * NHÂN VẬT BÉ YÊU *
     *******************/
    #Mfish, .Mbaby {
      position: absolute;
      top: 45%;
      left: 45%;
      width: 90px;
      height: auto;
      pointer-events: none;
      z-index: 50;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.18));
      transition: transform 0.12s ease-out;
      transform-origin: center center;
      will-change: transform, left, top;
    }

    /* Banner thông báo khi bé lớn thêm mỗi 10 thức ăn */
    .levelup-banner {
      position: fixed;
      top: 32%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.7);
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 50%, #ec4899 100%);
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 22px;
      padding: 14px 30px;
      border-radius: 9999px;
      box-shadow: 0 10px 30px rgba(234, 88, 12, 0.45), 0 0 0 4px rgba(255, 255, 255, 0.85);
      z-index: 200;
      pointer-events: none;
      white-space: nowrap;
      animation: levelupPop 1.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      text-align: center;
    }

    @keyframes levelupPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.4);
      }
      20% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.12);
      }
      35% {
        transform: translate(-50%, -50%) scale(1);
      }
      80% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -85px) scale(0.9);
      }
    }

    /* Icon đống phân - Vật cản rắn không thể đi xuyên qua */
    .poop-item {
      position: absolute;
      width: 52px;
      height: 52px;
      z-index: 45;
      pointer-events: none;
      filter: drop-shadow(0 6px 12px rgba(120, 53, 15, 0.45));
      animation: poopDrop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform: translate(-50%, -50%);
      will-change: transform;
    }

    .poop-item svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @keyframes poopDrop {
      0% {
        opacity: 0;
        transform: translate(-50%, -85%) scale(0.3);
      }
      65% {
        opacity: 1;
        transform: translate(-50%, -44%) scale(1.15);
      }
      100% {
        transform: translate(-50%, -50%) scale(1);
      }
    }

    /*****************************
     * CÁC MÓN HOA QUẢ & THỨC ĂN *
     *****************************/
    .food-item {
      position: absolute;
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      cursor: pointer;
      z-index: 20;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.12));
      transition: left 2.6s ease-out, top 2.6s ease-out, transform 0.3s ease;
      will-change: left, top, transform;
    }

    .food-item svg {
      width: 100%;
      height: 100%;
      display: block;
      animation: foodWobble 3s infinite ease-in-out alternate;
    }

    @keyframes foodWobble {
      0% { transform: translateY(0px) rotate(-4deg); }
      50% { transform: translateY(-6px) rotate(4deg); }
      100% { transform: translateY(0px) rotate(-3deg); }
    }

    /* Hiệu ứng khi bị bé ăn biến mất */
    .food-eaten {
      transform: scale(0) rotate(45deg) !important;
      opacity: 0;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease !important;
    }

    /* Bong bóng popup khi ăn được */
    .yum-popup {
      position: absolute;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 15px;
      color: #ea580c;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #fdba74;
      padding: 3px 10px;
      border-radius: 9999px;
      pointer-events: none;
      z-index: 60;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.25);
      animation: floatUpFade 0.75s ease-out forwards;
    }

    @keyframes floatUpFade {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.6);
      }
      50% {
        transform: translate(-50%, -90px) scale(1.15);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -120px) scale(1);
      }
    }

    /*****************************
     * GIAO DIỆN ĐIỀU KHIỂN (UI) *
     *****************************/
    /* Coordinate box ẩn/hiện khi có hash #xy */
    #coord {
      position: absolute;
      left: 14px;
      bottom: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #475569;
      background: rgba(255, 255, 255, 0.65);
      padding: 4px 8px;
      border-radius: 6px;
      pointer-events: none;
      z-index: 90;
    }

    body.dark-mode #coord {
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.7);
    }

    /* Bảng đếm số món ăn đã ăn */
    #eaten {
      position: absolute;
      text-align: center;
      left: 50%;
      transform: translateX(-50%);
      top: 16px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #0369a1;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 22px;
      border-radius: 9999px;
      box-shadow: 0 4px 16px rgba(3, 105, 161, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.8);
      z-index: 99;
      pointer-events: none;
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    body.dark-mode #eaten {
      color: #38bdf8;
      background: rgba(30, 41, 59, 0.85);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    /* Nút Thêm Thức Ăn */
    #FishIt {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 20px;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      border-radius: 9999px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      box-shadow: 0 6px 20px rgba(234, 88, 12, 0.38), 0 0 0 2px rgba(255, 255, 255, 0.4);
      cursor: pointer;
      touch-action: manipulation;
      z-index: 100;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #FishIt:hover {
      transform: translateX(-50%) translateY(-2px);
      box-shadow: 0 8px 24px rgba(234, 88, 12, 0.48);
    }

    #FishIt:active {
      transform: translateX(-50%) scale(0.95);
    }

    /* Nút Cài đặt (Settings) ở góc cao bên phải */
    #settingsBtn {
      position: fixed;
      right: 16px;
      top: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
      color: #334155;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      touch-action: manipulation;
      padding: 0;
      outline: none;
    }

    #settingsBtn:hover {
      transform: scale(1.08) rotate(30deg);
      background: #ffffff;
      color: #ea580c;
      box-shadow: 0 6px 20px rgba(234, 88, 12, 0.25);
    }

    #settingsBtn:active {
      transform: scale(0.92);
    }

    #settingsBtn.is-active {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: #ffffff;
      border-color: #ea580c;
      transform: rotate(90deg);
      box-shadow: 0 6px 20px rgba(234, 88, 12, 0.35);
    }

    body.dark-mode #settingsBtn {
      background: rgba(30, 41, 59, 0.88);
      color: #e2e8f0;
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    body.dark-mode #settingsBtn:hover {
      background: #1e293b;
      color: #fb923c;
    }

    body.dark-mode #settingsBtn.is-active {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: #ffffff;
    }

    /* Menu popup thả xuống khi bấm Cài đặt */
    #settingsMenu {
      position: fixed;
      right: 16px;
      top: 68px;
      min-width: 200px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.8);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px) scale(0.95);
      transform-origin: top right;
      transition: all 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #settingsMenu.is-open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    body.dark-mode #settingsMenu {
      background: rgba(30, 41, 59, 0.94);
      color: #e2e8f0;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .settings-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #64748b;
      margin-bottom: 8px;
      padding-left: 2px;
    }

    body.dark-mode .settings-title {
      color: #94a3b8;
    }

    .settings-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 6px;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 600;
      color: #334155;
      border-radius: 8px;
      transition: background 0.15s ease;
      user-select: none;
    }

    .settings-item:hover {
      background: rgba(0, 0, 0, 0.04);
    }

    body.dark-mode .settings-item {
      color: #e2e8f0;
    }

    body.dark-mode .settings-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .settings-item input[type="checkbox"] {
      accent-color: #f97316;
      width: 17px;
      height: 17px;
      cursor: pointer;
      margin: 0;
    }

    .settings-divider {
      height: 1px;
      background: rgba(0, 0, 0, 0.06);
      margin: 4px 0;
    }

    body.dark-mode .settings-divider {
      background: rgba(255, 255, 255, 0.08);
    }

    /* Template kho thức ăn ẩn */
    #food_templates {
      display: none;
    }

    @media (max-width: 600px) {
      #Mfish, .Mbaby {
        width: 72px;
      }
      .food-item {
        width: 38px !important;
        height: 38px !important;
      }
      #eaten {
        font-size: 13px;
        padding: 6px 16px;
        top: 66px;
      }
      #FishIt {
        font-size: 13.5px;
        padding: 10px 22px;
        bottom: 16px;
      }
      #settingsBtn {
        width: 38px;
        height: 38px;
        top: 12px;
        right: 12px;
      }
      #settingsMenu {
        top: 56px;
        right: 12px;
      }
    }
  </style>
</head>

  <script type="text/javascript">
    // Các biến trạng thái chính
    var baseBabyWidth = 90;     // Kích thước chuẩn ban đầu của bé
    var fX = -45;               // Độ lệch tâm X của bé (căn giữa ngón tay/chuột)
    var fY = -45;               // Độ lệch tâm Y của bé
    var xFLIP = 1;              // Hướng quay mặt của bé (1: nhìn sang phải, -1: nhìn sang trái)
    var maxLevel = 10;          // 10 cấp độ lớn lên (cứ mỗi 10 thức ăn tăng 1 cấp, cấp 10 to đầy màn hình)
    var currentLevel = 0;       // Cấp độ hiện tại: Math.floor(eaten / 10)
    var o_food_count = 0;       // Đếm số lượng món ăn đã sinh ra
    var o_food_list = [];       // Danh sách element thức ăn đang có trên màn hình
    var eaten = 0;              // Số lượng món ăn bé đã măm măm
    var isChewing = false;      // Cờ hiệu bé đang nhai nảy nhẹ
    var chewTimeout = null;

    // Quản lý hệ thống đống phân (vật cản rắn)
    var poop_list = [];         // Danh sách các đống phân: { element, x, y, radius }
    var currentBabyX = window.innerWidth / 2;
    var currentBabyY = window.innerHeight / 2;

    // Âm thanh Web Audio API (nhẹ nhàng, không cần tải file ngoài)
    var audioCtx = null;
    function playYumSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'sine';
        var now = audioCtx.currentTime;
        osc.frequency.setValueAtTime(480, now);
        osc.frequency.exponentialRampToValueAtTime(920, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.13);
      } catch (err) {
        // Fallback an toàn
      }
    }

    // Âm thanh thăng cấp vui nhộn khi bé to hơn sau mỗi 10 thức ăn
    function playLevelUpSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        var now = audioCtx.currentTime;
        var notes = [523.25, 659.25, 783.99, 1046.50]; // Hợp âm C - E - G - C cao vút
        notes.forEach(function(freq, idx) {
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.28, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.22);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.24);
        });
      } catch (e) {}
    }

    // Âm thanh "fart / poot" tếu táo khi bé ị ra đống phân
    function playPoopSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        var now = audioCtx.currentTime;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(155, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.22);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.24);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      } catch (e) {}
    }

    // Kích thước cửa sổ
    var width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
    var height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;

    // Tính toán scale tối đa để bé to vừa khít đầy màn hình (chiếm 88% cạnh nhỏ nhất của màn hình)
    function getMaxScale() {
      var minScreen = Math.min(width, height);
      var targetMaxSize = minScreen * 0.88;
      return Math.max(2.0, targetMaxSize / baseBabyWidth);
    }

    // Tính toán scale của bé theo cấp độ (cứ 10 thức ăn tăng 1 cấp)
    function getBabyScale() {
      var level = Math.floor(eaten / 10);
      if (level <= 0) return 1.0;
      var maxScale = getMaxScale();
      if (level >= maxLevel) return maxScale;
      return 1.0 + (level / maxLevel) * (maxScale - 1.0);
    }

    // Cập nhật transform của bé (giữ nguyên kích thước chuẩn, nảy nhẹ 8% khi ăn, không bị co rút về 1)
    function applyBabyTransform(bounce) {
      var babyEl = document.getElementById('Mfish');
      if (!babyEl) return;
      if (bounce !== undefined) {
        isChewing = bounce;
      }
      var scale = getBabyScale();
      if (isChewing) {
        scale *= 1.08; // Chỉ nảy nhẹ 8% trên kích thước hiện tại
      }
      babyEl.style.transform = "scaleX(" + xFLIP + ") scale(" + scale.toFixed(3) + ")";
    }

    // Xử lý va chạm vật lý: CHẶN KHÔNG CHO BÉ ĐI XUYÊN QUA ĐỐNG PHÂN
    function resolvePoopCollisions(x, y) {
      var resolvedX = x;
      var resolvedY = y;
      var scale = getBabyScale();
      // Bán kính va chạm của bé (tăng dần khi bé to lên)
      var babyRadius = 35 * scale;

      // Lặp 4 vòng kiểm tra để giải quyết trường hợp bé chạm nhiều đống phân cùng lúc
      for (var iter = 0; iter < 4; iter++) {
        for (var i = 0; i < poop_list.length; i++) {
          var poop = poop_list[i];
          var dx = resolvedX - poop.x;
          var dy = resolvedY - poop.y;
          var distSq = dx * dx + dy * dy;
          var minDist = babyRadius + poop.radius;

          if (distSq < minDist * minDist) {
            var dist = Math.sqrt(distSq);
            if (dist < 0.001) {
              dx = (xFLIP === 1 ? 1 : -1);
              dy = 0;
              dist = 1;
            }
            var nx = dx / dist;
            var ny = dy / dist;
            // Đẩy vị trí bé ra mép ngoài của đống phân
            resolvedX = poop.x + nx * minDist;
            resolvedY = poop.y + ny * minDist;
          }
        }
      }
      return { x: resolvedX, y: resolvedY };
    }

    // Hàm tạo 1 đống phân đứng yên vĩnh viễn ngay tại vị trí mông bé
    function spawnPoopAtBaby() {
      var template = document.getElementById("poop_template");
      if (!template) return;

      var poopDiv = document.createElement("div");
      poopDiv.className = "poop-item";
      poopDiv.innerHTML = template.innerHTML;

      var scale = getBabyScale();
      // Vị trí xuất hiện: phía sau mông của bé
      // Nếu xFLIP = 1 (mặt hướng phải) -> mông ở bên trái
      // Nếu xFLIP = -1 (mặt hướng trái) -> mông ở bên phải
      var offsetDist = 40 * scale;
      var poopX = currentBabyX - (xFLIP * offsetDist);
      var poopY = currentBabyY + (10 * scale);

      // Đảm bảo không rơi ra ngoài mép màn hình
      poopX = Math.max(30, Math.min(width - 30, poopX));
      poopY = Math.max(30, Math.min(height - 30, poopY));

      poopDiv.style.left = poopX + "px";
      poopDiv.style.top = poopY + "px";

      document.body.appendChild(poopDiv);

      // Thêm vào danh sách vật cản vĩnh viễn (không bao giờ mất đi)
      poop_list.push({
        element: poopDiv,
        x: poopX,
        y: poopY,
        radius: 26
      });

      playPoopSound();
      showYumPopup(poopX, poopY, "Ối, bé ị rồi! 💩💨");

      // Nếu bé bị cấn vào đống phân mới sinh, đẩy nhẹ bé ra ngoài
      var safePos = resolvePoopCollisions(currentBabyX, currentBabyY);
      currentBabyX = safePos.x;
      currentBabyY = safePos.y;
      var baby = document.getElementById('Mfish');
      if (baby) {
        baby.style.left = (safePos.x + fX) + 'px';
        baby.style.top = (safePos.y + fY) + 'px';
      }

      updateEatenHUD();
    }

    window.addEventListener('resize', function() {
      width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
      height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
      applyBabyTransform();
    });

    // Xóa món ăn khỏi mảng theo dõi
    function removeFoodItem(item) {
      var index = o_food_list.indexOf(item);
      if (index > -1) {
        o_food_list.splice(index, 1);
      }
    }

    // Xóa khỏi DOM
    function removeElement(element) {
      if (element && element.parentNode) {
        element.parentNode.removeChild(element);
      }
    }

    // Tạo popup chữ "+1 Món ngon" nổi lên khi ăn
    function showYumPopup(x, y, foodName) {
      var popup = document.createElement("div");
      popup.className = "yum-popup";
      var icons = ["🍓", "🍼", "🍎", "🍌", "🍉", "🍪", "🍩", "🧁", "🍦", "✨"];
      var randomIcon = icons[Math.floor(Math.random() * icons.length)];
      popup.innerHTML = "+1 " + (foodName || "Ngon quá") + " " + randomIcon;
      popup.style.left = x + "px";
      popup.style.top = y + "px";
      document.body.appendChild(popup);
      setTimeout(function() {
        removeElement(popup);
      }, 750);
    }

    // Hiển thị banner khi bé lớn thêm sau mỗi 10 thức ăn
    function triggerLevelUp(level) {
      playLevelUpSound();
      var banner = document.createElement("div");
      banner.className = "levelup-banner";
      if (level >= maxLevel) {
        banner.innerHTML = "👑 BÉ ĐÃ TO KHỔNG LỒ ĐẦY MÀN HÌNH! 🎉✨";
      } else {
        banner.innerHTML = "🎉 BÉ LỚN THÊM RỒI! (CẤP " + level + "/" + maxLevel + ") 🌟";
      }
      document.body.appendChild(banner);
      setTimeout(function() {
        removeElement(banner);
      }, 1350);
    }

    // Cập nhật bảng điểm, tiến độ lên cấp và số lượng đống phân
    function updateEatenHUD() {
      var eatenEl = document.getElementById("eaten");
      if (!eatenEl) return;
      var level = Math.floor(eaten / 10);
      var poopInfo = poop_list.length > 0 ? " • 💩 <b>" + poop_list.length + "</b> đống phân cản đường" : "";
      if (level >= maxLevel) {
        eatenEl.innerHTML = "👑 <b>Bé đã to khổng lồ đầy màn hình!</b> (" + eaten + " món đã măm măm)" + poopInfo;
      } else {
        var remaining = 10 - (eaten % 10);
        eatenEl.innerHTML = "🍼 Bé đã măm măm: <b>" + eaten + "</b> món " +
          "<span style='opacity:0.85;font-size:12px;margin-left:6px;font-weight:600;'>(Cấp " + level + "/" + maxLevel + " • Còn " + remaining + " món để lớn thêm!)</span>" + poopInfo;
      }
    }

    // Hàm kiểm tra va chạm giữa bé và các món ăn (đống phân KHÔNG PHẢI thức ăn, không bị ăn)
    function babyEatingCheck() {
      var babyEl = document.getElementById('Mfish');
      if (!babyEl) return;
      var babyRect = babyEl.getBoundingClientRect();

      var padding = 8;
      var bLeft = babyRect.left + padding;
      var bRight = babyRect.right - padding;
      var bTop = babyRect.top + padding;
      var bBottom = babyRect.bottom - padding;

      for (var i = o_food_list.length - 1; i >= 0; i--) {
        var food = o_food_list[i];
        if (!food || food.dataset.eaten === "true") continue;

        var fRect = food.getBoundingClientRect();
        var overlap = !(bRight < fRect.left ||
                        bLeft > fRect.right ||
                        bBottom < fRect.top ||
                        bTop > fRect.bottom);

        if (overlap) {
          food.dataset.eaten = "true";
          food.classList.add("food-eaten");
          var foodName = food.dataset.name || "Món ngon";
          var targetX = fRect.left + fRect.width / 2;
          var targetY = fRect.top + fRect.height / 2;

          // Hiệu ứng ăn
          showYumPopup(targetX, targetY, foodName);
          playYumSound();

          // Xóa thức ăn sau khi animation hoàn tất
          (function(fElement) {
            setTimeout(function() {
              removeFoodItem(fElement);
              removeElement(fElement);
            }, 250);
          })(food);

          eaten++;

          var prevLevel = currentLevel;
          var newLevel = Math.floor(eaten / 10);
          currentLevel = newLevel;

          // Hiệu ứng nảy nhẹ khi măm măm (không bị co rút về 1)
          if (chewTimeout) clearTimeout(chewTimeout);
          applyBabyTransform(true);
          chewTimeout = setTimeout(function() {
            applyBabyTransform(false);
          }, 120);

          // Cập nhật HUD
          updateEatenHUD();

          // Khi đủ thêm 10 thức ăn:
          // 1. Bé to hơn (lên cấp mới)
          if (newLevel > prevLevel) {
            triggerLevelUp(newLevel);
          }

          // 2. Cứ ăn được 10 món: bé sẽ tạo ra 1 icon đống phân sau 2 giây
          if (eaten % 10 === 0 && eaten > 0) {
            showYumPopup(currentBabyX, currentBabyY - 45, "Bé no bụng rồi! Sắp có bất ngờ sau 2s ⏳");
            setTimeout(function() {
              spawnPoopAtBaby();
            }, 2000);
          }
        }
      }
    }

    // Kiểm tra va chạm thường xuyên mỗi 45ms
    setInterval(babyEatingCheck, 45);

    // Xử lý di chuyển chuột và cảm ứng cho bé bò theo (CÓ CHẶN VẬT CẢN ĐỐNG PHÂN)
    (function() {
      var oldCoordX = window.innerWidth / 2;

      document.onmousemove = handlePointerMove;

      document.addEventListener('touchstart', function(e) {
        if (e.target.closest && (e.target.closest('#settingsBtn') || e.target.closest('#settingsMenu') || e.target.closest('#FishIt'))) return;
        if (e.touches && e.touches[0]) handlePointerMove(e.touches[0]);
      }, { passive: true });

      document.addEventListener('touchmove', function(e) {
        if (e.target.closest && (e.target.closest('#settingsBtn') || e.target.closest('#settingsMenu') || e.target.closest('#FishIt'))) return;
        if (e.touches && e.touches[0]) handlePointerMove(e.touches[0]);
      }, { passive: true });

      function handlePointerMove(event) {
        var pageX = event.pageX;
        var pageY = event.pageY;

        if (pageX == null && event.clientX != null) {
          var doc = document.documentElement;
          var body = document.body;
          pageX = event.clientX + (doc && doc.scrollLeft || body && body.scrollLeft || 0) - (doc && doc.clientLeft || body && body.clientLeft || 0);
          pageY = event.clientY + (doc && doc.scrollTop || body && body.scrollTop || 0) - (doc && doc.clientTop || body && body.clientTop || 0);
        }

        // Hướng quay mặt của bé theo hướng di chuyển chuột:
        if (pageX > oldCoordX + 2) {
          xFLIP = 1;
        } else if (pageX < oldCoordX - 2) {
          xFLIP = -1;
        }
        oldCoordX = pageX;

        // Xử lý vật cản: Bé không thể đi xuyên qua đống phân
        var safePos = resolvePoopCollisions(pageX, pageY);
        currentBabyX = safePos.x;
        currentBabyY = safePos.y;

        var baby = document.getElementById('Mfish');
        if (!baby) return;

        baby.style.left = (safePos.x + fX) + 'px';
        baby.style.top = (safePos.y + fY) + 'px';

        // Hiển thị tọa độ nếu trên url có #xy
        if (location.hash.substr(1) === "xy") {
          var text = "X: " + Math.round(safePos.x) + ", Y: " + Math.round(safePos.y) + " | Món ăn: " + o_food_list.length + " | Cấp: " + currentLevel + " | Phân: " + poop_list.length;
          document.getElementById("coord").innerHTML = text;
        } else {
          document.getElementById("coord").innerHTML = "";
        }

        applyBabyTransform();
      }
    })();

    // Lấy ngẫu nhiên template thức ăn từ kho SVG
    var foodTemplates = document.querySelectorAll("#food_templates > div");

    function createFoodElement() {
      if (!foodTemplates || foodTemplates.length === 0) return null;
      var randIndex = Math.floor(Math.random() * foodTemplates.length);
      var template = foodTemplates[randIndex];

      var foodDiv = document.createElement("div");
      foodDiv.className = "food-item";
      foodDiv.id = "food-" + o_food_count;
      foodDiv.dataset.name = template.getAttribute("data-name") || "Món ngon";
      foodDiv.dataset.type = template.getAttribute("data-type") || "fruit";
      foodDiv.innerHTML = template.innerHTML;

      // Kích thước đồ ăn tươi tắn, to rõ (42px - 54px)
      var randomSize = Math.floor(Math.random() * 13) + 42;
      foodDiv.style.width = randomSize + "px";
      foodDiv.style.height = randomSize + "px";

      o_food_count++;
      return foodDiv;
    }

    // Sinh 1 món ăn mới bay bổng trên màn hình
    function spawnFoodItem() {
      var food = createFoodElement();
      if (!food) return;

      function randW() {
        var min = 40;
        var max = Math.max(min, width - 80);
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function randH() {
        var min = 50;
        var max = Math.max(min, height - 90);
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      var startX = randW();
      var startY = randH();
      food.style.left = startX + "px";
      food.style.top = startY + "px";

      document.body.appendChild(food);
      o_food_list.push(food);

      function moveFood() {
        if (food.dataset.eaten === "true") return;
        var nextX = randW();
        var nextY = randH();
        food.style.left = nextX + "px";
        food.style.top = nextY + "px";

        var randomDuration = (Math.random() * 1.6 + 2.2).toFixed(1);
        food.style.transition = "left " + randomDuration + "s ease-in-out, top " + randomDuration + "s ease-in-out";

        setTimeout(moveFood, Math.floor(randomDuration * 1000) - 200);
      }

      setTimeout(moveFood, 300);
    }

    // Hàm gọi khi bấm nút "Thêm Thức Ăn"
    function spawnMoreFood() {
      var batch = Math.floor(Math.random() * 3) + 3;
      for (var i = 0; i < batch; i++) {
        setTimeout(spawnFoodItem, i * 120);
      }
    }

    // Tự động spawn ban đầu khi mở trang
    window.addEventListener("DOMContentLoaded", function() {
      for (var i = 0; i < 12; i++) {
        setTimeout(spawnFoodItem, i * 150);
      }
    });

    // Dark mode
    function toggleDarkMode(_this) {
      if (_this.checked) {
        document.body.classList.add("dark-mode");
      } else {
        document.body.classList.remove("dark-mode");
      }
    }

    // Spam thức ăn liên tục
    var autoSpawnTimer = null;
    function toggleAutoSpawn(_this) {
      if (_this.checked) {
        spawnMoreFood();
        autoSpawnTimer = setInterval(function() {
          if (o_food_list.length < 50) {
            spawnFoodItem();
          }
        }, 600);
      } else {
        if (autoSpawnTimer) {
          clearInterval(autoSpawnTimer);
          autoSpawnTimer = null;
        }
      }
    }

    // Điều khiển bật/tắt Popup Menu Cài đặt
    function toggleSettingsMenu(event) {
      if (event) {
        event.stopPropagation();
      }
      var menu = document.getElementById("settingsMenu");
      var btn = document.getElementById("settingsBtn");
      if (!menu || !btn) return;
      var isOpen = menu.classList.contains("is-open");
      if (isOpen) {
        menu.classList.remove("is-open");
        btn.classList.remove("is-active");
      } else {
        menu.classList.add("is-open");
        btn.classList.add("is-active");
      }
    }

    // Tự động đóng menu khi nhấp chuột ra ngoài
    document.addEventListener("click", function(event) {
      var menu = document.getElementById("settingsMenu");
      var btn = document.getElementById("settingsBtn");
      if (!menu || !btn) return;
      if (!menu.contains(event.target) && !btn.contains(event.target)) {
        menu.classList.remove("is-open");
        btn.classList.remove("is-active");
      }
    });
  </script>
</body>
</html>
